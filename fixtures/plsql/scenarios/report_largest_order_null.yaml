name: report_largest_order_null
unit: pkg_order_report
routine: largest_order
pinned:
  sysdate: '2026-01-15 09:30:00'
setup:
- INSERT INTO customers (customer_id, name, email, tier, credit_limit, registered_on) VALUES (1, 'Acme', NULL, 'GOLD', NULL, DATE '2025-04-01')
- INSERT INTO orders (order_id, customer_id, status, ordered_at, total_amount, note) VALUES (1001, 1, 'NEW', TIMESTAMP '2026-01-10 11:00:00', 300.00, NULL)
- INSERT INTO orders (order_id, customer_id, status, ordered_at, total_amount, note) VALUES (1002, 1, 'NEW', TIMESTAMP '2026-01-09 11:00:00', 900.00, NULL)
- INSERT INTO orders (order_id, customer_id, status, ordered_at, total_amount, note) VALUES (1003, 1, 'NEW', TIMESTAMP '2026-01-08 11:00:00', NULL, NULL)
call:
  kind: function
  name: pkg_order_report.largest_order
  args:
    p_customer_id: 1
  returns: NUMBER
capture_tables:
- orders
note: >-
  total_amount に NULL がある顧客。Oracle の ORDER BY ... DESC は既定が NULLS FIRST なので、
  cursor の先頭 1 件は NULL であり、%NOTFOUND も false なので 0 にもならない——この routine は
  NULL を返す。#20 で検討している NVL(MAX(...), 0) への書き換えは 900 を返すので、**答えが違う**。
  既存の report_largest_order は全行が非 NULL なので、この差を捕まえられない。
