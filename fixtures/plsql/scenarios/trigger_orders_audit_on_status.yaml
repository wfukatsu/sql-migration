name: trigger_orders_audit_on_status
unit: trg_orders_audit
routine: trg_orders_audit
pinned:
  sysdate: '2026-01-15 09:30:00'
  sequences:
    seq_audit_id: 1
setup:
- INSERT INTO customers (customer_id, name, email, tier, credit_limit, registered_on) VALUES (1, 'Acme', NULL, 'GOLD', NULL, DATE '2025-04-01')
- INSERT INTO orders (order_id, customer_id, status, ordered_at, total_amount, note) VALUES (1001, 1, 'NEW', TIMESTAMP '2026-01-10 11:00:00', NULL, NULL)
- INSERT INTO orders (order_id, customer_id, status, ordered_at, total_amount, note) VALUES (1002, 1, 'NEW', TIMESTAMP '2026-01-11 11:00:00', NULL, NULL)
call:
  kind: procedure
  name: pkg_stock_reserve.claim_batch
  args:
    p_limit: 2
capture_tables:
- orders
- audit_log
mask:
  audit_log:
  - changed_at
  # claim_batch は ORDER BY の無い `ROWNUM <= p_limit` で取るので、どの行から処理するかは Oracle でも
  # 決まっていない。2 件とも CLAIMED になり監査行も 2 行揃うが、**どちらが audit_id=1 になるかは偶然**
  # である——移行先でも実行ごとに入れ替わった（2026-09-19）。番号は比べず、行の組として比べる
  - audit_id
