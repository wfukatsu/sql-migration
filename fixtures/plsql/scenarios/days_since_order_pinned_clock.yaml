# SYSDATE の固定が効いていることを示すシナリオ。固定が外れると結果が日ごとに変わる
name: days_since_order_pinned_clock
unit: pkg_money_calc
routine: days_since_order
pinned:
  sysdate: "2026-01-15 09:30:00"
setup:
  - "INSERT INTO customers (customer_id, name, tier, registered_on) VALUES (1, 'Acme', 'BRONZE', DATE '2025-04-01')"
  - "INSERT INTO orders (order_id, customer_id, status, ordered_at) VALUES (1001, 1, 'NEW', TIMESTAMP '2026-01-10 23:59:59')"
call:
  kind: function
  name: pkg_money_calc.days_since_order
  args: {p_order_id: 1001}
  returns: NUMBER
capture_tables: [orders]
