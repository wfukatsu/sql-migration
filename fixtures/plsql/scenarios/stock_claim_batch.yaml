name: stock_claim_batch
unit: pkg_stock_reserve
routine: claim_batch
pinned:
  sysdate: '2026-01-15 09:30:00'
  sequences:
    seq_audit_id: 1
setup:
- INSERT INTO customers (customer_id, name, email, tier, credit_limit, registered_on) VALUES (1, 'A', NULL, 'GOLD', NULL, DATE '2025-04-01')
- INSERT INTO orders (order_id, customer_id, status, ordered_at, total_amount, note) VALUES (1001, 1, 'NEW', TIMESTAMP '2026-01-10 11:00:00', NULL, NULL)
- INSERT INTO orders (order_id, customer_id, status, ordered_at, total_amount, note) VALUES (1002, 1, 'NEW', TIMESTAMP '2026-01-11 11:00:00', NULL, NULL)
call:
  kind: procedure
  name: pkg_stock_reserve.claim_batch
  args:
    p_limit: 1
capture_tables:
- orders
- audit_log
mask:
  audit_log:
  - changed_at
note: FOR UPDATE SKIP LOCKED と WHERE CURRENT OF。ROWNUM で 1 件に絞る
nondeterministic:
  reason: >-
    ROWNUM <= p_limit に ORDER BY が無いので、NEW の注文のどれを CLAIMED にするかは Oracle でも決まらない（heap の順。
    移行先では走査の順）。確かめるのは「NEW の注文のうち p_limit 件が CLAIMED になり、その件数の監査行が残る」こと
  decided: '2026-09-26'
  ignore_columns:
    orders: [order_id, ordered_at]
    audit_log: [key_value]
