# trg_orders_audit（status 変更で発火）を実際に踏ませる。
# trigger は SYSTIMESTAMP を書くため changed_at をマスクする。
name: audit_trigger_on_status_change
unit: trg_orders_audit
routine: trg_orders_audit
pinned:
  sysdate: "2026-01-15 09:30:00"
  sequences: {seq_audit_id: 1}
setup:
  - "INSERT INTO customers (customer_id, name, tier, registered_on) VALUES (1, 'Acme', 'GOLD', DATE '2025-04-01')"
  - "INSERT INTO orders (order_id, customer_id, status, ordered_at) VALUES (1001, 1, 'NEW', TIMESTAMP '2026-01-10 11:00:00')"
  - "INSERT INTO orders (order_id, customer_id, status, ordered_at) VALUES (1002, 1, 'NEW', TIMESTAMP '2026-01-11 11:00:00')"
call:
  kind: procedure
  name: pkg_stock_reserve.claim_batch
  args: {p_limit: 2}
capture_tables: [orders, audit_log]
mask:
  audit_log: [changed_at]
