# 生成コードの外で決めること — 記録（docs/plsql-decisions-outside-generator.md §0.2）
#
# skills/plsql-migrate/scripts/decision_items.py が読み書きする。手で直してもよいが、
# 「決定」には 決定・決めた人・日付 が要る。答えた人のいない項目を「決定」と書かない。
#
#   状態      未決 / 決定 / 対象外（生成物に出ていない）
#   出た      スクリプトが生成物から拾った根拠（毎回書き直す）
#   案        業務文書などから引いた答えの候補。決定ではない（出典を書く）
#   食い違い  業務文書と生成物（または元の PL/SQL）が食い違うところ。再設計の要否の問題として残す
#   残り      決定のうち、まだ決まっていない部分（例: 時刻は決めたが、間隔に収まるかの測定は未了）

items:
  OPS-1:
    状態: 決定
    出た:
    - '`application/TriggerChecks.java` / `TriggerCheckJob.java` — TriggerCheckJob.java; TriggerChecks.java'
    決定: a. アプリの外の定期ジョブ（Kubernetes CronJob など）から TriggerCheckJob.daily / hourly を呼ぶ。全件読みを業務と同じプロセスで動かさないため
    決めた人: 移行担当（PoC 実施者）
    日付: '2026-09-19'
    記録先: 運用設計書
  OPS-2:
    状態: 決定
    出た:
    - '`application/TriggerChecks.java` / `TriggerCheckJob.java` — TriggerCheckJob.java; TriggerChecks.java'
    決定: 日次の照合（監査 A 型・採番 C 型）は毎日 01:00。間隔は daily / hourly の既定のまま
    決めた人: 移行担当（PoC 実施者）
    日付: '2026-09-19'
    記録先: 運用設計書（ジョブの定義）
    残り: hourly の照合（payments / products の全件）が本番の件数で 1 時間に収まるかの測定
  OPS-3:
    状態: 決定
    出た:
    - '`application/TriggerChecks.java` / `TriggerCheckJob.java` — TriggerCheckJob.java; TriggerChecks.java'
    決定: A（監査漏れ）は TriggerCheckJob.daily が BACKFILL の印つきで自動で補う。B / D / C は運用担当に通知し、人が判断して記録する
    決めた人: 移行担当（PoC 実施者）
    日付: '2026-09-19'
    記録先: 運用設計書（障害対応の手順）
    残り: 通知先と対応期限、対応済みの印をどこに持つか（同じずれが毎回報告されるため）
  OPS-4:
    状態: 決定
    出た:
    - '`application/TriggerChecks.java` / `TriggerCheckJob.java` — TriggerCheckJob.java; TriggerChecks.java'
    - '`db/trigger-check-baseline.sql` — db/trigger-check-baseline.sql'
    決定: prc_purge_audit は日次照合の成功後にだけ走るようジョブの依存を定義する。控えの表は db/trigger-check-baseline.sql で先に作る
    決めた人: 移行担当（PoC 実施者）
    日付: '2026-09-19'
    記録先: 運用設計書（ジョブの依存関係）
  OPS-5:
