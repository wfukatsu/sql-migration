    決定: 楽観制御に移した routine は、衝突（commit の失敗）だけを 3 回まで再試行し、待ちを 50→100→200 ms と増やす。業務例外（在庫不足 -20030 など）は再試行しない。採番や外部通知を同じトランザクションに入れない
    決めた人: 移行担当（PoC 実施者）
    日付: '2026-09-19'
    記録先: limits.yaml の rowLocks.optimistic の理由欄、呼び出し側の設計書
