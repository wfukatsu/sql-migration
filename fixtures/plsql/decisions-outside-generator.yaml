  CALL-1:
    状態: 決定
    出た:
    - '`<routine>Targets` / `One` / `Failed` / `Start` / `Done` / `FailedBatch`（割った routine） — markReviewed; prcNightlyClose;
      prcPurgeAudit; prcRepriceAll; restock'
    決定: 衝突で弾かれた 1 反復は 3 回まで再試行し、直列で回す。途中で落ちたら最後に処理したキー（pAfterKey）から再開する
    決めた人: 移行担当（PoC 実施者）
    日付: '2026-09-19'
    記録先: 呼び出し側の設計書
    残り: restock は Targets を持たない（対象は呼び出し側が渡す）ので、キーでの再開は呼び出し側で持つ。各 One が冪等か（再試行・再開で二重に処理しないか）の確認
  CALL-2:
    状態: 決定
