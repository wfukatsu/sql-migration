      prcPurgeAudit; prcRepriceAll; restock'
    決定: 1 反復が再試行を使い切ったとき、または対象の読み取り（Targets）が失敗したときに prcNightlyCloseFailedBatch を呼び、処理を止める
    決めた人: 移行担当（PoC 実施者）
