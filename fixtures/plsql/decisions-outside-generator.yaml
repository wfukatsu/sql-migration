    決定: ジョブ全体が失敗したら運用担当に通知し、即時に 1 回だけ再実行する。それも失敗したら次の回を待つ。daily が失敗した日は prc_purge_audit も走らない（OPS-4 の依存）
    決めた人: 移行担当（PoC 実施者）
    日付: '2026-09-19'
    記録先: 運用設計書
