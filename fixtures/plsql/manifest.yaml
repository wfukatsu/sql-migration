# P0-2: corpus の期待値タグ
#
# 判定適合率（計画 §8）は、ルールエンジンの出した判定をこのファイルの expected と突き合わせて測る。
# 粒度は routine 単位である。package の中で判定が割れるため（pkg_dynamic_search が典型）、
# ファイル単位では測れない。
#
# origin   : real-anonymized | synthetic   -- 現時点は全件 synthetic（計画 §9 の決定、2026-09-17）
# holdout  : true のユニットは、grammar のパッチ作成とルール作成では参照しない。
#            判定適合率はまず holdout 上の値を根拠にする
# expected : AUTO | REVIEW | REDESIGN      -- 設計書 §6 の移行方針に対応する
# reason   : なぜその判定なのかを 1 行で。ルールを書く側が根拠を読めるようにするためのもの

version: 1
corpus_root: src

units:

  - name: pkg_customer_crud
    files: [pkg_customer_crud.pks, pkg_customer_crud.pkb]
    categories: [simple-crud]
    origin: synthetic
    holdout: false
    routines:
      # 2026-09-17 修正: P2-2 のルール SEM-002 との不一致を調べ、manifest 側の誤りと判断した。
      # SYSDATE は DB サーバのクロックとタイムゾーンで決まり、JVM の時刻とは別物である。
      # 既存の scalardb_migrate/appside.py も以前から APP_SEMANTICS として警告している。
      # 2026-09-20 / #5: 以前の期待値は REVIEW。止めていたのは NVL に当たる SEM-003 だけで、SYSDATE を見るルールは
      # P4-3 から無い（SYSDATE は呼び出し側が渡し、FIXED_DATE で固定して registered_on まで実 DB で比べている）。
      # NVL は SQL の外へ持ち上がり、ランタイムが Oracle と同じ意味（'' は NULL）で計算する
      - {name: create_customer, expected: AUTO,   reason: "主キー INSERT のみ。NVL はランタイムが計算し、'' は書き込み境界で NULL になる。SYSDATE は呼び出し側が渡す"}
      - {name: update_email,    expected: AUTO,   reason: "主キー UPDATE と SQL%ROWCOUNT。影響行数を Result に保持すれば足りる"}
      - {name: delete_customer, expected: AUTO,   reason: "主キー DELETE のみ"}
      - {name: customer_name,   expected: AUTO,   reason: "主キーの SELECT INTO と NO_DATA_FOUND の握り潰し"}

  - name: prc_add_product
    files: [prc_add_product.prc]
    categories: [simple-crud]
    origin: synthetic
    holdout: false
    routines:
      - {name: prc_add_product, expected: AUTO, reason: "単独 procedure、主キー INSERT のみ"}

  - name: pkg_order_status
    files: [pkg_order_status.pks, pkg_order_status.pkb]
    categories: [select-into-exception]
    origin: synthetic
    holdout: false
    routines:
      - {name: status_of,            expected: AUTO,   reason: "主キーの SELECT INTO。NO_DATA_FOUND を業務例外へ写す"}
      - {name: status_for_customer,  expected: REVIEW, reason: "非キー列の SELECT INTO。TOO_MANY_ROWS の発火条件を再現できるか要確認"}
      - {name: assert_open,          expected: AUTO,   reason: "package 内呼び出しと PRAGMA EXCEPTION_INIT のローカル例外"}

  - name: pkg_order_pricing
    files: [pkg_order_pricing.pks, pkg_order_pricing.pkb]
    categories: [private-call]
    origin: synthetic
    holdout: false
    routines:
      - {name: tier_discount,  expected: AUTO,   reason: "純粋関数。spec に無いので private method"}
      - {name: line_amount,    expected: AUTO,   reason: "純粋関数"}
      # 2026-09-20 / #13: 「JOIN 制約に当たるか」は変換器が答えるようになった（FROM 側を入れ替えてそのまま実行できる）。
      # そのまま実行できる結合に SEM-005 は掛けないと決めたので AUTO。以前の期待値は REVIEW
      - {name: customer_tier,  expected: AUTO,   reason: "2 表 JOIN。変換器がそのまま実行できる形にする（capability が OK）"}
      - {name: order_total,    expected: REVIEW, reason: "Cursor FOR LOOP で N+1。行数次第でアプリ集計へ寄せる"}
      - {name: reprice_order,  expected: REVIEW, reason: "UPDATE の値に関数呼び出し。呼び出しを外へ出す書き換えが要る"}

  - name: pkg_customer_view
    files: [pkg_customer_view.pks, pkg_customer_view.pkb]
    categories: [type-rowtype]
    origin: synthetic
    holdout: false
    routines:
      - {name: load,       expected: AUTO,   reason: "%ROWTYPE を列名対応の record へ。主キーアクセス"}
      - {name: summary,    expected: AUTO,   reason: "package ローカル record 型への SELECT INTO"}
      - {name: copy_limit, expected: AUTO,   reason: "%TYPE 変数を介した主キー間コピー"}

  - name: pkg_order_report
    files: [pkg_order_report.pks, pkg_order_report.pkb]
    categories: [cursor-loop]
    origin: synthetic
    holdout: false
    routines:
      - {name: count_by_status, expected: AUTO,   reason: "走査して数える cursor（#11 の C）。COUNT(*) 1 本に置き換わり、cursor の寿命そのものが無くなる"}
      - {name: mark_reviewed,   expected: REVIEW, reason: "非キー列の走査で回しながら同じ表を更新する。走査行数の上限が要る"}
      - {name: largest_order,   expected: REVIEW, reason: "先頭 1 行を取る cursor（#11 の B）。LIMIT 1 で生成できるが、ORDER BY がパーティションキーに乗らないため走査がパーティションをまたぐ（SCAN-002）"}

  - name: pkg_bulk_load
    files: [pkg_bulk_load.pks, pkg_bulk_load.pkb]
    categories: [bulk]
    origin: synthetic
    holdout: false
    routines:
      - {name: restock,             expected: REDESIGN, reason: "FORALL SAVE EXCEPTIONS。部分失敗を許す原子性は業務要件で決める"}
      # 2026-09-19 / #19: 本体は塊の件数を足すだけなので COUNT(*) に書き換える。行を持たず、LIMIT が
      # 正でないときの誤り（ORA-06502 / ORA-06500）も Oracle と同じに投げる——人が見る論点が残らない
      - {name: collect_open_orders, expected: AUTO,     reason: "件数を数えるだけの分割読み。COUNT(*) で同じ答えになる（#19）"}
      - {name: archive_lines,       expected: REVIEW,   reason: "BULK COLLECT + FORALL INSERT。採番に順序オブジェクトを使う点は別途 REDESIGN"}

  - name: prc_nightly_close
    files: [prc_nightly_close.prc]
    categories: [commit-in-routine]
    origin: synthetic
    holdout: false
    routines:
      - {name: prc_nightly_close, expected: REDESIGN, reason: "routine 内 COMMIT と SAVEPOINT / ROLLBACK TO。use case 単位へ再境界化が要る"}

  - name: prc_audit_autonomous
    files: [prc_audit_autonomous.prc]
    categories: [commit-in-routine]
    origin: synthetic
    holdout: false
    routines:
      - {name: prc_audit_autonomous, expected: REDESIGN, reason: "Autonomous Transaction。親が失敗しても残る意味を outbox 等で保つ必要がある"}

  - name: pkg_dynamic_search
    files: [pkg_dynamic_search.pks, pkg_dynamic_search.pkb]
    categories: [dynamic-sql]
    origin: synthetic
    holdout: false
    routines:
      - {name: refresh_stats, expected: REVIEW,   reason: "定数 EXECUTE IMMEDIATE。定数畳込み後に静的解析できる"}
      - {name: count_orders,  expected: REVIEW,   reason: "条件分岐による有限 variant。variant ごとに静的 query 化する"}
      - {name: purge,         expected: REDESIGN, reason: "表名が実行時に決まる。allowlist か専用 Repository へ"}

  - name: trg_orders_audit
    files: [trg_orders_audit.trg]
    categories: [trigger-dblink]
    origin: synthetic
    holdout: false
    routines:
      - {name: trg_orders_audit, expected: REDESIGN, reason: "監査 trigger。before/after 値と失敗時挙動を保って interceptor / outbox へ"}

  - name: trg_orders_seq
    files: [trg_orders_seq.trg]
    categories: [trigger-dblink]
    origin: synthetic
    holdout: false
    routines:
      - {name: trg_orders_seq, expected: REDESIGN, reason: "採番 trigger。ScalarDB に順序オブジェクトが無く、順序性と欠番の許容を要件化する"}

  - name: prc_remote_sync
    files: [prc_remote_sync.prc]
    categories: [trigger-dblink]
    origin: synthetic
    holdout: false
    routines:
      - {name: prc_remote_sync, expected: REDESIGN, reason: "DB Link 越しの分散トランザクション。参加 DB・timeout・再試行の設計が要る"}

  - name: pkg_money_calc
    files: [pkg_money_calc.pks, pkg_money_calc.pkb]
    categories: [datatype-edge]
    origin: synthetic
    holdout: false
    routines:
      - {name: rounded_total,    expected: REVIEW, reason: "ROUND は half-up。Java の BigDecimal 既定(HALF_EVEN)と異なる"}
      # P4-3 で REVIEW -> AUTO へ変更（2026-09-17）。元の理由は「Oracle DATE の時刻成分と TRUNC。日付差の
      # 意味を保つ必要がある」で、その懸念は全て測定で閉じた: TRUNC と日付減算は P3-3 が実機 Oracle から
      # 記録し（fixtures/plsql/semantics.json の date 族）PlsqlPropertyTest が Plsql の再現を検査する、
      # routine 全体は money_days_since_order が両金額規約で Oracle と一致する、時計の読みは 1 回、
      # TZ 依存構文・NLS 依存書式・DATE への CAST のいずれも含まない。エンジンの出力に合わせたのではなく、
      # 実機の記録に合わせた。holdout ではないユニットである（holdout の期待値は変更しない）。
      - {name: days_since_order, expected: AUTO,   reason: "TRUNC と日付差のみ。P3-3 の記録済み Oracle 挙動が覆う範囲（P4-3）"}
      # 2026-09-20 / #5: 以前の期待値は REVIEW。空文字 = NULL は同一視を保つと決定し、この条件式と RTRIM は互換
      # ランタイム（Plsql.isNull / eq / rtrim）が Oracle と同じ意味で計算する。移行先 DB が評価する式は無い
      - {name: display_note,     expected: AUTO,   reason: "空文字 = NULL の条件式と RTRIM。どちらも PL/SQL の式で、互換ランタイムが計算する"}
      - {name: apply_rate,       expected: REVIEW, reason: "NUMBER(14,2) の乗算と丸め。ScalarDB に DECIMAL が無くスケール済み整数を検討する"}

  - name: pkg_stock_reserve
    files: [pkg_stock_reserve.pks, pkg_stock_reserve.pkb]
    categories: [concurrency-lock]
    origin: synthetic
    holdout: false
    routines:
      - {name: reserve,          expected: REDESIGN, reason: "SELECT FOR UPDATE の行ロック。ScalarDB の分離レベル／楽観制御へ置き換える"}
      - {name: reserve_nowait,   expected: REDESIGN, reason: "FOR UPDATE NOWAIT と ORA-54 の捕捉。待たない意味を別設計にする"}
      - {name: next_payment_id,  expected: REDESIGN, reason: "行ロックで直列化する採番。競合と再試行の方針を決める"}
      - {name: claim_batch,      expected: REDESIGN, reason: "FOR UPDATE SKIP LOCKED と WHERE CURRENT OF。取り合いの意味を保てない"}

  # --- holdout: ルール・grammar の作成時は参照しない ---------------------------------------------

  - name: pkg_payment
    files: [holdout/pkg_payment.pks, holdout/pkg_payment.pkb]
    categories: [select-into-exception, datatype-edge]
    origin: synthetic
    holdout: true
    routines:
      - {name: paid_total,   expected: REVIEW, reason: "集約は 0 件でも 1 行返る。NO_DATA_FOUND にならず NULL になる差を保つ"}
      # 2026-09-18 / #12: payments への INSERT には `trg_payments_guard`（B 型・検証して拒否する）が
      # 掛かる。**漏れた書き込みは検証されない**ので、網羅性の要求は監査より高い
      - {name: record_payment, expected: REDESIGN, reason: "主キー SELECT INTO + INSERT。ただし payments への書き込みなので trg_payments_guard を呼ぶ——検証を免れる経路が無いことの担保が要る（#12）"}
      - {name: last_paid_at, expected: REVIEW, reason: "TIMESTAMP WITH TIME ZONE の MAX。セッション TZ 依存を検出する"}

  - name: prc_reprice_all
    files: [holdout/prc_reprice_all.prc]
    categories: [cursor-loop, commit-in-routine]
    origin: synthetic
    holdout: true
    routines:
      - {name: prc_reprice_all, expected: REDESIGN, reason: "明示 cursor で回しながら 50 件ごとに COMMIT する。Tx 境界の再設計が要る"}

  - name: pkg_customer_import
    files: [holdout/pkg_customer_import.pks, holdout/pkg_customer_import.pkb]
    categories: [bulk, dynamic-sql]
    origin: synthetic
    holdout: true
    routines:
      - {name: import,            expected: REVIEW,   reason: "FORALL の中の MERGE。upsert の原子性と競合条件を確認する"}
      - {name: truncate_staging,  expected: REDESIGN, reason: "表名が実行時に決まる TRUNCATE。ScalarDB に TRUNCATE が無い点も含めて再設計"}

  - name: trg_products_audit
    files: [holdout/trg_products_audit.trg]
    categories: [trigger-dblink]
    origin: synthetic
    holdout: true
    routines:
      - {name: trg_products_audit, expected: REDESIGN, reason: "検証と監査を兼ねる trigger。全書込経路を Service 側で統制する必要がある"}

  - name: pkg_order_lock
    files: [holdout/pkg_order_lock.pks, holdout/pkg_order_lock.pkb]
    categories: [concurrency-lock, private-call, type-rowtype]
    origin: synthetic
    holdout: true
    routines:
      - {name: is_cancellable, expected: AUTO,     reason: "純粋関数。BOOLEAN は PL/SQL 専用型なので Java boolean へ"}
      - {name: snapshot,       expected: AUTO,     reason: "%ROWTYPE の主キーアクセス"}
      - {name: cancel,         expected: REDESIGN, reason: "FOR UPDATE WAIT 5 の行ロック。待ち時間つきロックの意味を保てない"}

  # --- Issue #29 の 25（2026-09-20）: DELETE の trigger と複数イベントの trigger ---------------------------
  #
  # 「trigger を呼び出しに置き換える」実装と一緒に書いた。**holdout ではない**（実装中に挙動を見ている）。
  # 実 DB の evidence を routine 経由で取るためにある: 直接の DML に移行先の trigger は掛からない（#12 §0）。

  - name: trg_lines_audit
    files: [trg_lines_audit.trg]
    categories: [trigger-dblink]
    origin: synthetic
    holdout: false
    routines:
      - {name: trg_lines_audit, expected: REDESIGN, reason: "INSERT / UPDATE OF qty / DELETE の 3 イベントで発火する監査 trigger。本体は INSERTING / UPDATING で分岐する"}

  - name: trg_inventory_tx_keep
    files: [trg_inventory_tx_keep.trg]
    categories: [trigger-dblink]
    origin: synthetic
    holdout: false
    routines:
      - {name: trg_inventory_tx_keep, expected: REDESIGN, reason: "DELETE で発火する検証 trigger。消される行の :OLD を読む"}

  - name: pkg_line_edit
    files: [pkg_line_edit.pks, pkg_line_edit.pkb]
    categories: [simple-crud, trigger-dblink]
    origin: synthetic
    holdout: false
    routines:
      - {name: add_line,    expected: REDESIGN, reason: "order_lines への INSERT。trg_lines_audit を呼ぶ——網羅性の判断を引き継ぐ（#12）"}
      - {name: change_qty,  expected: REDESIGN, reason: "主キー UPDATE。qty を SET するので trg_lines_audit（UPDATE OF qty）を呼ぶ"}
      - {name: remove_line, expected: REDESIGN, reason: "主キー DELETE。消す前に :OLD を読んで trg_lines_audit を呼ぶ"}
      - {name: void_entry,  expected: REDESIGN, reason: "主キー DELETE。BEFORE DELETE の trg_inventory_tx_keep を先に呼ぶ"}

  # --- Issue #29 の 23（2026-09-20）: オーバーロード。実装と一緒に書いたので holdout ではない ---------------
  - name: pkg_contact
    files: [pkg_contact.pks, pkg_contact.pkb]
    categories: [simple-crud]
    origin: synthetic
    holdout: false
    routines:
      # オーバーロードは宣言順の番号で呼び分ける（`pkg_contact.set_email~1`）
      - {name: "set_email~1", expected: AUTO, reason: "主キー UPDATE のみ（引数 2 つの版）"}
      - {name: "set_email~2", expected: AUTO, reason: "主キー UPDATE のみ（引数 3 つの版）"}
      - {name: clear_email,   expected: AUTO, reason: "引数の数で set_email~1 に解決できる呼び出しだけ"}

  # --- holdout2: ルールが固まった後（2026-09-17）に書き起こした独立ホールドアウト --------------------
  #
  # P2-2 のルール開発中に holdout の期待判定を参照してしまい、独立性が失われた（../README.md に経緯）。
  # ここは「ルールを一度も調整していない routine」であり、期待判定はエンジンを走らせる前に確定させた。
  # 結果が悪くてもルールを直さず、数字をそのまま報告する。

  - name: pkg_shipment
    files: [holdout2/pkg_shipment.pks, holdout2/pkg_shipment.pkb]
    categories: [select-into-exception, private-call, datatype-edge]
    origin: synthetic
    holdout: true
    routines:
      - {name: line_count,      expected: REVIEW, reason: "集約の SELECT INTO。0 件でも 1 行返るため NO_DATA_FOUND にならない"}
      - {name: is_shippable,    expected: REVIEW, reason: "主キーの SELECT INTO だが line_count を呼ぶ。呼び出し先の判断に従う"}
      # 2026-09-18 / #12: orders への UPDATE には `trg_orders_audit` が掛かる。移行先に trigger は
      # 無いので、掛けるのは**書き込む側**になり、この routine はその trigger を呼ぶ。呼び出し先が
      # REDESIGN（網羅性を保証できない）なら、この経路もその判断を引き継ぐ
      - {name: mark_shipped,    expected: REDESIGN, reason: "主キー UPDATE と SQL%ROWCOUNT。ただし orders への書き込みなので trg_orders_audit を呼ぶ——網羅性の判断を引き継ぐ（#12）"}
      - {name: days_in_transit, expected: REVIEW, reason: "TRUNC と SYSDATE と TIMESTAMP から DATE への CAST。日付の意味を保つ必要がある"}

  - name: prc_purge_audit
    files: [holdout2/prc_purge_audit.prc]
    categories: [commit-in-routine, cursor-loop]
    origin: synthetic
    holdout: true
    routines:
      - {name: prc_purge_audit, expected: REDESIGN, reason: "明示 cursor で回しながら 200 件ごとに COMMIT する"}

  - name: trg_payments_guard
    files: [holdout2/trg_payments_guard.trg]
    categories: [trigger-dblink]
    origin: synthetic
    holdout: true
    routines:
      - {name: trg_payments_guard, expected: REDESIGN, reason: "検証 trigger。全書込経路を Service 側で統制する必要がある"}

  - name: pkg_tier_admin
    files: [holdout2/pkg_tier_admin.pks, holdout2/pkg_tier_admin.pkb]
    categories: [concurrency-lock, simple-crud]
    origin: synthetic
    holdout: true
    routines:
      - {name: promote,          expected: REDESIGN, reason: "SELECT FOR UPDATE の行ロック"}
      - {name: set_credit_limit, expected: AUTO,     reason: "主キー UPDATE のみ"}
