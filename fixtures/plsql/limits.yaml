# 走査行数の上限（2026-09-17 の決定、値は 2026-09-18 に #19 で決定）。
#
# 生成コードは cursor の行を先に全部読むので、動く行数はメモリで決まる。上限は業務ごとに違うため、
# 既定をここに置き、routine 単位で上書きする。超えたら例外で止まる。
#
# **既定値に根拠は無い。** 既定に落ちている routine は「何行来るか誰も決めていない」という意味である。
# AUTO と判定された routine がそこに落ちていたら `--limits-strict` が生成を失敗させる（#19）——
# 「無人で生成してよい」と「誰も決めていない」は両立しないため。
#
# 上限の役割は**異常を止めること**であって、「まず来ない値」を置くことではない。緩い値は、
# 異常をその分だけ見逃す。
scanRows:
  default: 10000
  routines:
    # 受注明細。1 注文あたりの明細数。200 明細を超える注文は業務側で確認すべき異常とみなす。
    # 以前は 1000 だったが、それは「まず来ない値」であって上限ではなかった（#19 / 2026-09-18）
    pkg_order_pricing.order_total: 200
    # 同じ order_lines を同じ order_id で絞るので、同じ質問・同じ値
    pkg_order_lock.cancel: 200

# ここに書かない routine について（#19 / 2026-09-18 の決定）:
#
# * prc_nightly_close は**上限では守らない**。締め対象の件数は業務が決める数ではなく、その日たまたま
#   溜まった数である。上限に当たれば夜間バッチが止まり、翌朝まで誰も気づかない。値を上げるのは
#   「当たらないようにする」だけでメモリの問題は残る。TX-001 でどのみち再設計が要るので、
#   「1 回に処理する件数」はその設計の中で決める。
# * pkg_order_report.mark_reviewed も同じ性質（status = :p の全件）で、こちらは #20 のパターン D
#   再設計とセットである。
