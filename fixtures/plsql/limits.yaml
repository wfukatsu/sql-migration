# 走査行数の上限（2026-09-17 の決定、値は 2026-09-18 に #19 で決定）。
#
# 生成コードは cursor の行を先に全部読むので、動く行数はメモリで決まる。上限は業務ごとに違うため、
# 既定をここに置き、routine 単位で上書きする。超えたら例外で止まる。
#
# **既定値に根拠は無い。** 既定に落ちている routine は「何行来るか誰も決めていない」という意味である。
# ルールが行数上限の確認を要求している routine（requiredTests: row_limit ＝ CUR-002・BULK-001・SQL-002）
# がそこに落ちていたら、`--limits-strict` が生成を失敗させる（#19）。
#
# 決めた形は 2 つある。どちらも「決めた」として扱う:
#
#   routines    … 値を書く
#   notLimited  … 上限では守らないと決めて、**理由を書く**
#
# 理由をコメントではなくデータに書くのは、コメントが読み手への説明であって決定の記録ではないからである。
# 書き忘れと「置かないと決めた」を、ツールが区別できる必要がある。
#
# 上限の役割は**異常を止めること**であって、「まず来ない値」を置くことではない。緩い値は、
# 異常をその分だけ見逃す。
scanRows:
  default: 10000

  routines:
    # 受注明細。1 注文あたりの明細数。200 明細を超える注文は業務側で確認すべき異常とみなす。
    # 以前は 1000 だったが、それは「まず来ない値」であって上限ではなかった（#19 / 2026-09-18）
    pkg_order_pricing.order_total: 200
    # 同じ order_lines を同じ order_id で絞るので、同じ質問・同じ値
    pkg_order_lock.cancel: 200

  notLimited:
    # 締め対象の件数は業務が決める数ではなく、その日たまたま溜まった数である。上限に当たれば夜間
    # バッチが止まり、翌朝まで誰も気づかない。値を上げるのは「当たらないようにする」だけで、
    # メモリの問題は残る（#19 / 2026-09-18）
    prc_nightly_close: TX-001 の再設計で「1 回に処理する件数」を決める

# ここに無い routine は「まだ誰も決めていない」である。`--limits-strict` が名前を挙げる:
#
#   pkg_order_report.mark_reviewed     → #20 のパターン D 再設計とセット
#   pkg_stock_reserve.claim_batch      → #9 の行ロック再設計とセット
#   pkg_bulk_load.collect_open_orders  → BULK COLLECT（BULK-001）
#   pkg_bulk_load.archive_lines        → 同上
#   trg_payments_guard.body            → 実行計画に分解される文（SQL-002）。trigger 自体が #12
#
# 勝手に notLimited へ入れない。「決めた」と書けるのは、決めた人がいるときだけである。

# 行ロックを落として**楽観制御 + 呼び出し側の再試行**へ移すと決めた routine（#9 / 2026-09-18）。
#
# 既定は「決めていない」であり、決めていない routine の書き込みは**拒否したままにする**
# （docs/plsql-transaction-patterns.md §A）。ロックこそがその読み書きを安全にしていたので、
# 落ちた以上、黙って書き換えを進めてはならない。
#
# 安全なのは**同じトランザクションの中で読んで書く**からで、衝突は Consensus Commit が弾く
# （P3-4 で実測。DB-CORE-20013）。弾かれたものを再試行するのは呼び出し側の責務である（計画 §9）。
#
# routine ごとに書くのは、決めることが routine ごとに違うためである——その呼び出し側が再試行するのか、
# その操作が冪等か、業務例外と衝突を区別できるか。
rowLocks:
  optimistic:
    pkg_stock_reserve.reserve: >-
      在庫は読んだ値から計算する。同じトランザクションの中で読んで書くので、衝突は commit で弾かれる。
      業務例外（-20030 在庫不足）は再試行しても結果が変わらないので、呼び出し側は衝突だけを再試行する
    pkg_tier_admin.promote: >-
      書き込む値は引数で、読んだ値に依存しない。読みは「既に同じ tier なら何もしない」の判定にだけ使う
