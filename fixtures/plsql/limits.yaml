# 走査行数の上限（2026-09-17 の決定、値は 2026-09-18 に #19 で決定）。
#
# 生成コードは cursor の行を先に全部読むので、動く行数はメモリで決まる。上限は業務ごとに違うため、
# 既定をここに置き、routine 単位で上書きする。超えたら例外で止まる。
#
# **既定値に根拠は無い。** 既定に落ちている routine は「何行来るか誰も決めていない」という意味である。
# ルールが行数上限の確認を要求している routine（requiredTests: row_limit ＝ CUR-002・BULK-001・SQL-002）
# がそこに落ちていたら、`--limits-strict` が生成を失敗させる（#19）。
#
# 決めた形は 2 つある。どちらも「決めた」として扱う:
#
#   routines    … 値を書く
#   notLimited  … 上限では守らないと決めて、**理由を書く**
#
# 理由をコメントではなくデータに書くのは、コメントが読み手への説明であって決定の記録ではないからである。
# 書き忘れと「置かないと決めた」を、ツールが区別できる必要がある。
#
# 上限の役割は**異常を止めること**であって、「まず来ない値」を置くことではない。緩い値は、
# 異常をその分だけ見逃す。
scanRows:
  default: 10000

  routines:
    # 受注明細。1 注文あたりの明細数。200 明細を超える注文は業務側で確認すべき異常とみなす。
    # 以前は 1000 だったが、それは「まず来ない値」であって上限ではなかった（#19 / 2026-09-18）
    pkg_order_pricing.order_total: 200
    # 同じ order_lines を同じ order_id で絞るので、同じ質問・同じ値
    pkg_order_lock.cancel: 200
    # これも 1 注文の明細を読む。同じ問いには同じ答え（#19 / 2026-09-19）
    pkg_bulk_load.archive_lines: 200

  notLimited:
    # 締め対象の件数は業務が決める数ではなく、その日たまたま溜まった数である。上限に当たれば夜間
    # バッチが止まり、翌朝まで誰も気づかない。値を上げるのは「当たらないようにする」だけで、
    # メモリの問題は残る（#19 / 2026-09-18）
    prc_nightly_close: TX-001 の再設計で「1 回に処理する件数」を決める

# ここに無い routine は「まだ誰も決めていない」である。`--limits-strict` が名前を挙げる。
#
# 2026-09-19（#19）に、**人が値を決めなくて済む形**へ変えたものがある——ここに書かなくても挙がらない:
#
#   問い合わせ自身が件数を絞っている走査（`claim_batch` の `LIMIT p_limit`）
#     -> 読む行数を決めているのは問い合わせで、その件数を渡すのは呼び出し側である
#   件数を数えるだけの分割読み（`collect_open_orders`）
#     -> COUNT(*) にしたので、行を持たない
#   1 反復 = 1 トランザクションに割った routine（transactions.perIteration）
#     -> 処理対象をキー順に件数つきで繰り返し読む。上限は「1 回に何行ずつ取るか」（運用の調整値）になる
#
# 勝手に notLimited へ入れない。「決めた」と書けるのは、決めた人がいるときだけである。

# 行ロックを落として**楽観制御 + 呼び出し側の再試行**へ移すと決めた routine（#9 / 2026-09-18）。
#
# 既定は「決めていない」であり、決めていない routine の書き込みは**拒否したままにする**
# （docs/plsql-migration/plsql-transaction-patterns.md §A）。ロックこそがその読み書きを安全にしていたので、
# 落ちた以上、黙って書き換えを進めてはならない。
#
# 安全なのは**同じトランザクションの中で読んで書く**からで、衝突は Consensus Commit が弾く
# （P3-4 で実測。DB-CORE-20013）。弾かれたものを再試行するのは呼び出し側の責務である（計画 §9）。
#
# routine ごとに書くのは、決めることが routine ごとに違うためである——その呼び出し側が再試行するのか、
# その操作が冪等か、業務例外と衝突を区別できるか。
rowLocks:
  optimistic:
    pkg_stock_reserve.reserve: >-
      在庫は読んだ値から計算する。同じトランザクションの中で読んで書くので、衝突は commit で弾かれる。
      業務例外（-20030 在庫不足）は再試行しても結果が変わらないので、呼び出し側は衝突だけを再試行する
    pkg_tier_admin.promote: >-
      書き込む値は引数で、読んだ値に依存しない。読みは「既に同じ tier なら何もしない」の判定にだけ使う
    pkg_stock_reserve.reserve_nowait: >-
      `NOWAIT` は「待たない」という指定だが、ScalarDB では**待たないのが既定**なので指定自体が
      意味を失う（transaction-patterns §B）。ORA-54 に相当するのは「衝突で失敗したトランザクション」
      で、呼び出し側が再試行する。**分かるタイミングが変わる**——Oracle は読んだ瞬間、ScalarDB は
      commit である。`-20031` を業務判断に使っている呼び出し側があれば、それは commit 時点では遅い
    pkg_stock_reserve.next_payment_id: >-
      採番方式は決まっている（計画 §9 / 2026-09-17）——`seq_payment_id` は NOCACHE なので
      「counters 表 + 再試行」であり、この routine はまさにその形（読む・+1 する・書く）である。
      弾かれた衝突を再試行するのは呼び出し側で、二重採番は起きない（TransactionIT で実測）。
      counters の行は高衝突点なので、他の更新と同じトランザクションに入れないこと（§D）
    pkg_bulk_load.restock: >-
      在庫を差分で動かす（`SET stock_qty = stock_qty + <delta>`）。1 要素 = 1 トランザクションの
      中で読んでから書く 2 文に割る（#24 で境界を割ったのと同じ単位）。衝突は commit で弾かれ、
      **弾かれた要素は何も書いていない**ので、呼び出し側はその要素だけを安全に再試行できる
      ——二重加算にならない。失敗した要素を記録して続けるのは `SAVE EXCEPTIONS` の要件そのもの
      で、それは #14 / #3 で決めた形が持っている（cursor-patterns §G）
    pkg_customer_import.import: >-
      MERGE を「読んでから UPDATE か INSERT を選ぶ」へ割る。UPSERT にすると既存行で WHEN MATCHED が
      設定していない列まで上書きする（#26 で実害を実測: tier GOLD->BRONZE、registered_on がずれる）。
      #26 は converter を WARN のままにし、許容できない移行では読んでから選ぶ形にする、と決めて
      いる。同じトランザクションの中で読んで書くので、同時に「無い」と読んだ 2 つは commit で片方が
      弾かれる。呼び出し側はその 1 要素だけを再試行する（FORALL の 1 要素は冪等: 同じ名前を書く）
    pkg_stock_reserve.claim_batch: >-
      FOR UPDATE SKIP LOCKED を落とし、楽観制御で取り合う（2026-09-19 の決定）。担当者列は足さない:
      ScalarDB では担当者列を立てても「読んでから書く」ことに変わりはなく、同じ行を取った 2 人の
      片方が commit で弾かれるのは同じである。claim_batch は取ること自体が 1 トランザクションで
      完結するので、列が無くても二重取りは起きない。違いは「待たずに飛ばす」が「弾かれて再試行」に
      なることで、再試行は呼び出し側の責務（次の NEW を取る）
    pkg_order_lock.cancel: >-
      在庫を戻す `SET stock_qty = stock_qty + r.qty` を、同じトランザクションの中で読んでから書く
      2 文に割る。同じ商品が明細に 2 行あっても更新は失われない（RmwIT で実測——自分の書き込みは
      読める）。呼び出し側は衝突だけを再試行する

# トランザクション境界を **1 反復 = 1 トランザクション**に割ると決めた routine（#3 の決定、
# 実装は #24 / #14、2026-09-18）。
#
# 記録された routine は、1 つの method ではなく**トランザクション単位に割った部品**として出る
# （`Start` / `Targets` / `One` / `Failed` / `Done` / `FailedBatch`）。**生成コードはループを
# 持たない**——回すのは呼び出し側で、推奨の回し方はコメントとして出る（#24 の決定）。
#
# 既定は「決めていない」である。書いていない routine はいままでどおり 1 つの method として出て、
# `COMMIT` のところで止まる。**止まっているのが正しい**: 境界をどこに引くかは業務の設計であって、
# 生成器が推測してよいものではない。
#
# 判定（TX-001 / TX-003 / BULK-002）は **REDESIGN のまま**にしてある。生成できるようになった
# ことと、そのまま移してよいことは別である（trigger を REDESIGN のままにしたのと同じ理由）。
transactions:
  perIteration:
    prc_nightly_close: >-
      1 受注 = 1 トランザクション。冪等性の入口は新設しない——`SHIPPED` -> `CLOSED` の遷移が
      持っている（#3 §E）。エラー行（`ROLLBACK TO` のあとに書いていた行）と `batch_control` は
      別トランザクションにする。`batch_control` は高衝突点なので、本体と同じ中に入れない（§D / §F）
    prc_reprice_all: >-
      1 受注 = 1 トランザクション。**#3 §E で既に決めてある**——1 反復が別 routine の呼び出しで
      あるものは、呼ばれる側がトランザクションを開かない（計画 §9 の既定）ので、この粒度が
      自動的に成立する。50 件ごとの中間コミットは境界そのものに吸収される
    prc_purge_audit: >-
      1 行 = 1 トランザクション。**#3 §E で「揃える」と決めてある**——DELETE だけで冪等なので
      どちらでも壊れないが、揃えると生成器の形が 1 つになる。200 件ごとの中間コミットは境界
      そのものに吸収される。対象を読むのは別トランザクションなので、自分が消す表を読んでいても
      よい（P2-4 に当たらない）
    pkg_order_report.mark_reviewed: >-
      1 注文 = 1 トランザクション（#19 の決定、2026-09-19）。#20 では 1 トランザクションで回す形（A）に
      したが、`p_status = 'SHIPPED'` で呼ばれると出荷済みの注文を過去の分まで全部 1 トランザクションで
      書き換える——行数も大きさも業務では決められない。本体は同じ値を書くだけで何度走らせても同じ
      なので、原子性を失っても実害が小さい
    pkg_bulk_load.restock: >-
      1 要素 = 1 トランザクション。`FORALL ... SAVE EXCEPTIONS` が表している要件（続行して
      記録する）は #3 で決めたものと同じなので、同じ形に揃える（#14 / cursor-patterns §G）。
      `SQL%BULK_EXCEPTIONS` は移行先に無いが、**どの要素が失敗したかは catch した側が知っている**

  # 自分だけで 1 つのトランザクションになる routine（自律トランザクション）。**#3 §G で決めてある**
  # ——別トランザクションにする。呼び出し側がそれを別の境界で呼ぶ。生成物には COMMIT / ROLLBACK は
  # 出ない（境界は呼び出し側にある / 計画 §9）
  separate:
    prc_remote_sync: >-
      末尾の COMMIT は「この routine 全体で 1 つのトランザクション」という意味である。移行先では呼び出し側が
      1 つの境界で呼ぶ（計画 §9: 生成コードはトランザクションを開かない）。ローカルの読みと、倉庫側の 2 つの書き込みが
      同じ ScalarDB トランザクションに入る（dbLinks.warehouse_link）
    prc_audit_autonomous: >-
      監査行は親が失敗しても残る（PRAGMA AUTONOMOUS_TRANSACTION。Oracle 23ai で実測）。移行先で
      同じにするには、呼び出し側が**別のトランザクションで**呼ぶ——同じ中で呼べば親と一緒に消える。
      corpus にこの routine の呼び出し元は無いので、境界を持つのは移行後のアプリである

# 表名が実行時に決まる動的 SQL の、**受け付けてよい表名**（2026-09-19 の決定）。
#
# `'DELETE FROM ' || p_table_name || ...` は走りうる文が数えられない。数えられるようにするのは、人が
# 表名を決めたときだけである。一覧に無い表名が渡されたら、生成コードは実行時に拒否する——Oracle なら
# どの表でも走ったが、それを許すことこそ移行で塞ぎたい穴である。書いていない routine は拒否のまま。
dynamicTables:
  # 古い在庫履歴を消す。created_at を持つ表だけが意味を持つ
  pkg_dynamic_search.purge: [inventory_tx]
  # 名前は staging だが、corpus のシナリオが渡しているのは inventory_tx である（staging 用の表は
  # schema に無い）。移行先で staging 表を作るなら、その名前をここに書き足す
  pkg_customer_import.truncate_staging: [inventory_tx]

# DB link の行き先（2026-09-20 の決定）。その link の表を ScalarDB の管理下に置き、**別の namespace として同じ
# トランザクションで書く**。Oracle が分散トランザクションでやっていたことを、ScalarDB のトランザクションが引き受ける
# ——原子性は変わらない。前提は、相手側の表が ScalarDB のメタデータ列を持ち、相手側への書き込みもすべて ScalarDB を
# 通ること。outbox などの結果整合にするのは意味を変えるので、移行とは別の仕様変更として扱う。
# ここに無い link は「まだ誰も決めていない」で、LINK-001 は未決定のまま残る。
dbLinks:
  warehouse_link:
    namespace: warehouse
    reason: >-
      倉庫側の orders / shipment_queue も ScalarDB の管理下に置き、同じトランザクションで書く（A 案）。
      倉庫側への書き込みはすべて ScalarDB 経由にすること
