plugins {
    id 'java'
    id 'application'
}

group = 'com.scalar.migrate'
version = '0.1.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
}

repositories { mavenCentral() }

ext { scalardbVersion = '3.19.1' }

// `-PcoreOnly` leaves out everything that is not needed to build and test against the ScalarDB Core API: the
// ScalarDB SQL JDBC driver and the Cluster client SDK (commercial licence), the MySQL driver (GPL) and Oracle's
// (OTN licence). None of them is used at compile time -- the code reaches them through java.sql and the ScalarDB
// configuration -- so they are runtime dependencies, and a build that may not carry them can drop them:
//   gradle -PcoreOnly test installDist      # CoreFetcher / Loader / the residual engine; no JdbcFetcher, no Bench
def coreOnly = providers.gradleProperty('coreOnly').isPresent()

// every configuration resolves to the versions in gradle.lockfile; `gradle dependencies --write-locks` renews it
dependencyLocking {
    lockAllConfigurations()
    // the two builds resolve different sets, and a lock file that names a module the build leaves out is an error
    lockFile = file(coreOnly ? 'gradle-core.lockfile' : 'gradle.lockfile')
}

dependencies {
    // ScalarDB Core (Apache 2): transactional CRUD API, used by CoreFetcher / Loader (no license required)
    implementation "com.scalar-labs:scalardb:${scalardbVersion}"
    // Residual engine: pure-Java in-memory SQL with Oracle / PostgreSQL / MySQL compatibility modes
    implementation 'com.h2database:h2:2.5.250'
    implementation 'com.google.code.gson:gson:2.14.0'
    // SLF4J provider for ScalarDB's logging (slf4j-api 2.0.x comes with ScalarDB): warnings and errors to stderr,
    // configured in src/main/resources/simplelogger.properties
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.18'
    runtimeOnly 'org.postgresql:postgresql:42.7.4'
    if (!coreOnly) {
        // ScalarDB SQL JDBC driver + Cluster client SDK: used by JdbcFetcher (requires ScalarDB Cluster, licensed)
        runtimeOnly "com.scalar-labs:scalardb-sql-jdbc:${scalardbVersion}"
        runtimeOnly "com.scalar-labs:scalardb-cluster-java-client-sdk:${scalardbVersion}"
        // MySQL JDBC: used only by the DML benchmark (difftest/bench_dml.py) to time MySQL as the migration source
        runtimeOnly 'com.mysql:mysql-connector-j:8.4.0'
        // Oracle JDBC: used ONLY by the benchmark (Bench.java) to time the migration-source database from the same JVM
        runtimeOnly 'com.oracle.database.jdbc:ojdbc11:23.5.0.24.07'
    }

    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // P3-1: the ScalarDB-side harness reads the same fixtures/plsql/scenarios/*.yaml the Oracle harness reads,
    // so that a difference between the two captures is a difference between the databases and not between two
    // transcriptions of the same case.
    testImplementation 'org.yaml:snakeyaml:2.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// P2-10: the generated sources compile as part of this module.
//
// The decision (plan §9) was to keep Spring out, so this is the whole of it: one source set entry and no new
// dependency. `generated/` is written by `python -m plsql.generate` and must never be edited by hand -- every
// change belongs in the rules or the generator, or the next regeneration loses it.
//
// `plsql.generatedDir` points the source set at another tree, which is what `python -m plsql.generate
// --verify-compile` passes when it writes somewhere other than `generated/` (#21). Without it the check
// would compile whatever happened to be in `generated/` and call it a verdict on this run's output.
//
// `plsql.verify` says the compile IS that check. The fallback below is silent by design -- an ordinary
// `gradle compileJava` must keep working -- and a silent fallback is exactly what a check must not have: if
// the two sides ever stop agreeing on the property name, the check would compile the previous run's output
// and report it as this one's success. Under `plsql.verify` the fallback becomes an error instead.
ext {
    generatedDir = providers.gradleProperty('plsql.generatedDir').getOrElse(null)
    if (generatedDir == null) {
        if (providers.gradleProperty('plsql.verify').isPresent()) {
            throw new GradleException("plsql.verify was set without plsql.generatedDir: the compile check "
                    + "would silently compile ../generated instead of the tree it just wrote")
        }
        generatedDir = rootProject.file('../generated').absolutePath
    }
}

// The check must not leave its answer in the build the repository uses. Compiling a throwaway tree into
// `build/` replaces the corpus's classes with someone else's, and two runs at once fight over the same
// directory. `plsql.buildDir` gives the check its own; the default is the one every other build uses.
if (providers.gradleProperty('plsql.buildDir').isPresent()) {
    layout.buildDirectory = file(providers.gradleProperty('plsql.buildDir').get())
}

// The compile check reads javac's output to name the routine each error came from, and javac speaks the
// JVM's language. Pinning it here means the reader does not have to enumerate languages -- the same reason
// `applicationDefaultJvmArgs` pins the runner's locale. Only under `plsql.verify`: forking costs a JVM, and
// an ordinary build has no one parsing its messages.
if (providers.gradleProperty('plsql.verify').isPresent()) {
    tasks.withType(JavaCompile).configureEach {
        options.fork = true
        options.forkOptions.jvmArgs = ['-Duser.language=en', '-Duser.country=US']
    }
}

sourceSets {
    main {
        java {
            srcDir file("${generatedDir}/src/main/java")
        }
        resources {
            srcDir file("${generatedDir}/src/main/resources")
        }
    }
}

test {
    useJUnitPlatform()
    // Gradle runs tests in a forked JVM, so -D on the gradle command line does NOT reach @EnabledIfSystemProperty.
    // Without this, `gradle test -Dplsql.generated=1` disables the generated-code harnesses and the build passes
    // green having run nothing -- a silent skip that looks exactly like a pass.
    for (String property : ['plsql.generated', 'plsql.variant']) {
        if (System.getProperty(property) != null) systemProperty property, System.getProperty(property)
    }
    testLogging { showStandardStreams = true }
}

application {
    mainClass = 'com.scalar.migrate.runtime.Runner'
    applicationName = 'residual-runner'
    // Oracle-style TO_CHAR('DAY'/'MON') depends on the JVM locale; Oracle's default NLS_DATE_LANGUAGE is AMERICAN
    applicationDefaultJvmArgs = ['-Duser.language=en', '-Duser.country=US']
}
