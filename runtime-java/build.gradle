plugins {
    id 'java'
    id 'application'
}

group = 'com.scalar.migrate'
version = '0.1.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
}

repositories { mavenCentral() }

ext { scalardbVersion = '3.19.1' }

dependencies {
    // ScalarDB Core (Apache 2): transactional CRUD API, used by CoreFetcher / Loader (no license required)
    implementation "com.scalar-labs:scalardb:${scalardbVersion}"
    // ScalarDB SQL JDBC driver + Cluster client SDK: used by JdbcFetcher (requires ScalarDB Cluster, licensed)
    implementation "com.scalar-labs:scalardb-sql-jdbc:${scalardbVersion}"
    implementation "com.scalar-labs:scalardb-cluster-java-client-sdk:${scalardbVersion}"
    // Residual engine: pure-Java in-memory SQL with Oracle / PostgreSQL / MySQL compatibility modes
    implementation 'com.h2database:h2:2.5.250'
    implementation 'com.google.code.gson:gson:2.14.0'
    // SLF4J provider for ScalarDB's logging (slf4j-api 2.0.x comes with ScalarDB): warnings and errors to stderr,
    // configured in src/main/resources/simplelogger.properties
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.18'
    runtimeOnly 'org.postgresql:postgresql:42.7.4'
    // MySQL JDBC: used only by the DML benchmark (difftest/bench_dml.py) to time MySQL as the migration source
    runtimeOnly 'com.mysql:mysql-connector-j:8.4.0'
    // Oracle JDBC: used ONLY by the benchmark (Bench.java) to time the migration-source database from the same JVM
    implementation 'com.oracle.database.jdbc:ojdbc11:23.5.0.24.07'

    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // P3-1: the ScalarDB-side harness reads the same fixtures/plsql/scenarios/*.yaml the Oracle harness reads,
    // so that a difference between the two captures is a difference between the databases and not between two
    // transcriptions of the same case.
    testImplementation 'org.yaml:snakeyaml:2.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// P2-10: the generated sources compile as part of this module.
//
// The decision (plan §9) was to keep Spring out, so this is the whole of it: one source set entry and no new
// dependency. `generated/` is written by `python -m plsql.generate` and must never be edited by hand -- every
// change belongs in the rules or the generator, or the next regeneration loses it.
sourceSets {
    main {
        java {
            srcDir rootProject.file('../generated/src/main/java')
        }
        resources {
            srcDir rootProject.file('../generated/src/main/resources')
        }
    }
}

test {
    useJUnitPlatform()
    // Gradle runs tests in a forked JVM, so -D on the gradle command line does NOT reach @EnabledIfSystemProperty.
    // Without this, `gradle test -Dplsql.generated=1` disables the generated-code harnesses and the build passes
    // green having run nothing -- a silent skip that looks exactly like a pass.
    for (String property : ['plsql.generated', 'plsql.variant']) {
        if (System.getProperty(property) != null) systemProperty property, System.getProperty(property)
    }
    testLogging { showStandardStreams = true }
}

application {
    mainClass = 'com.scalar.migrate.runtime.Runner'
    applicationName = 'residual-runner'
    // Oracle-style TO_CHAR('DAY'/'MON') depends on the JVM locale; Oracle's default NLS_DATE_LANGUAGE is AMERICAN
    applicationDefaultJvmArgs = ['-Duser.language=en', '-Duser.country=US']
}
