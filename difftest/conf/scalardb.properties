# ScalarDB Core client (used by residual-runner --fetcher core and by the loader) running on the host.
# Consensus Commit transactions over the PostgreSQL backend. The application code never sees these settings.
scalar.db.storage=jdbc
scalar.db.contact_points=jdbc:postgresql://localhost:15433/scalardb
scalar.db.username=postgres
scalar.db.password=postgres
scalar.db.transaction_manager=consensus-commit
scalar.db.consensus_commit.isolation_level=SERIALIZABLE
# cross-partition scans are needed for fetches that do not cover the partition key (guardrail: JDBC backends only)
scalar.db.cross_partition_scan.enabled=true
scalar.db.cross_partition_scan.filtering.enabled=true
scalar.db.cross_partition_scan.ordering.enabled=true
