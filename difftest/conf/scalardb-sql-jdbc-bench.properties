# ScalarDB SQL JDBC client for the benchmark (difftest/bench.py) -> ScalarDB Cluster on the host port.
# Same as scalardb-sql-jdbc.properties but with the benchmark namespace, so the benchmark data set
# never collides with the differential-test tables.
scalar.db.sql.connection_mode=cluster
scalar.db.sql.cluster_mode.contact_points=indirect:localhost
scalar.db.sql.default_namespace_name=bench
