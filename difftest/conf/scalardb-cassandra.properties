# ScalarDB Core client (residual-runner --fetcher core and the loader) on the host -> Cassandra backend.
# Cassandra counterpart of scalardb.properties (docs/cassandra-verification-plan.md). The application code never sees these settings.
scalar.db.storage=cassandra
scalar.db.contact_points=localhost
scalar.db.contact_port=9042
scalar.db.username=cassandra
scalar.db.password=cassandra
scalar.db.transaction_manager=consensus-commit
scalar.db.consensus_commit.isolation_level=SERIALIZABLE
# cross-partition scans are used with JDBC (RDBMS) backends only (user decision 2026-09-11): on Cassandra, ScalarDB
# does key access only (GET / partition SCAN / index SCAN); filtering, sorting and full-table reads are not delegated
scalar.db.cross_partition_scan.enabled=false
scalar.db.cross_partition_scan.filtering.enabled=false
# ordering must stay off as well: ScalarDB 3.19.1 refuses to start with it on Cassandra
# (DB-CORE-10128: Cross-partition scan with ordering is not supported in Cassandra)
scalar.db.cross_partition_scan.ordering.enabled=false
# rows per storage scan page (default 10). With 10, every 10 scanned rows cost a Cassandra round trip: a 5,000-row
# filtered scan took 1.6 s instead of 0.1 s (docs/cassandra-verification-report.md)
scalar.db.scan_fetch_size=1000
