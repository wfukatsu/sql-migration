# ScalarDB Core client (loader, --fetcher core) on the host -> Oracle Database as the ScalarDB backend
# (docs/oracle-backend-verification-plan.md). Same instance as the migration source, but ScalarDB's own user/schemas.
scalar.db.storage=jdbc
scalar.db.contact_points=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
scalar.db.username=scalardb
scalar.db.password=scalardb
scalar.db.transaction_manager=consensus-commit
scalar.db.consensus_commit.isolation_level=SERIALIZABLE
scalar.db.cross_partition_scan.enabled=true
scalar.db.cross_partition_scan.filtering.enabled=true
scalar.db.cross_partition_scan.ordering.enabled=true

# Connection pools sized for Oracle Database Free, which serves both the migration source and this backend: ScalarDB's
# JDBC defaults (min_idle 20 per pool) exhausted its server processes (ORA-12516) once nodes were restarted per case
scalar.db.jdbc.connection_pool.min_idle=1
scalar.db.jdbc.connection_pool.max_total=10
scalar.db.jdbc.table_metadata.connection_pool.min_idle=1
scalar.db.jdbc.table_metadata.connection_pool.max_total=5
scalar.db.jdbc.admin.connection_pool.min_idle=1
scalar.db.jdbc.admin.connection_pool.max_total=5
