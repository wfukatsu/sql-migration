# Differential-test environment (docs/app-side-processing-plan.md §5).
#
#   source-postgres : the "migration source" database. ONLY the test harness talks to it (to compute expected results).
#   backend-postgres: the storage behind ScalarDB. NOTHING but ScalarDB connects to it (the harness never does).
#   scalardb-cluster: optional, licensed. Enables the ScalarDB SQL / JDBC path (fetcher=jdbc). Put the license lines
#                     into license.properties, run ./make-cluster-conf.sh, then
#                     `docker compose --profile cluster up -d`. Without it, the runtime uses the ScalarDB Core path
#                     (fetcher=core), which needs no license.
#   backend-cassandra / scalardb-cluster-cassandra (profile cassandra): the same, with Apache Cassandra as the ScalarDB
#                     backend (docs/cassandra-verification-plan.md). The node listens on host port 60054. Do not run both
#                     cluster nodes at once on an 8 GiB Docker VM: `docker compose stop scalardb-cluster` first.
# The published ports bind to 127.0.0.1: the passwords below are well-known defaults, and a bare "1521:1521" listens
# on every interface of the host. To reach a container from another machine, tunnel (ssh -L) rather than widen this.
services:
  source-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: source
    ports: ["127.0.0.1:15432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 2s, timeout: 3s, retries: 30 }

  source-oracle:
    # Oracle Database 23ai Free (successor of Oracle XE; XE 21c has no ARM64 image). Migration source for the
    # Oracle-dialect cases. ONLY the harness connects here. Start with `docker compose --profile oracle up -d`.
    image: gvenzl/oracle-free:23-slim-faststart
    profiles: ["oracle"]
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: source
      APP_USER_PASSWORD: source
    ports: ["127.0.0.1:1521:1521"]
    healthcheck: { test: ["CMD", "healthcheck.sh"], interval: 10s, timeout: 5s, retries: 90 }

  backend-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: scalardb
    ports: ["127.0.0.1:15433:5432"]   # exposed for the ScalarDB Core client running on the host; the harness never connects here
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 2s, timeout: 3s, retries: 30 }

  schema-loader:
    image: ghcr.io/scalar-labs/scalardb-schema-loader:3.19.1
    profiles: ["tools"]
    depends_on:
      backend-postgres: { condition: service_healthy }
    volumes:
      - ./conf:/conf:ro
      - ./work:/work:ro
    command: ["--config", "/conf/scalardb-in-docker.properties", "--schema-file", "/work/schema.json", "--coordinator"]

  scalardb-cluster:
    image: ghcr.io/scalar-labs/scalardb-cluster-node-byol-premium:3.19.1
    profiles: ["cluster"]
    depends_on:
      backend-postgres: { condition: service_healthy }
    ports: ["127.0.0.1:60053:60053"]
    volumes:
      # generated by ./make-cluster-conf.sh (base config + trial/commercial license lines; git-ignored)
      - ./work/scalardb-cluster-node.properties:/scalardb-cluster/node/scalardb-cluster-node.properties:ro

  backend-cassandra:
    # Apache Cassandra 5.0 (the newest version ScalarDB 3.19 supports), single node. Storage behind the Cassandra-backed
    # ScalarDB Cluster; the harness never connects here. Heap capped at 1 GiB to fit next to Oracle on an 8 GiB VM.
    image: cassandra:5.0
    profiles: ["cassandra"]
    environment:
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
      CASSANDRA_CLUSTER_NAME: difftest
      # Paxos implementation behind the lightweight transactions and SERIAL reads that Consensus Commit relies on.
      # Kept at the image default v1: a quick check with v2 (fewer round trips on paper) did not lower point-operation
      # latency here (docs/cassandra-verification-report.md). `PAXOS_VARIANT=v2 docker compose ...` to try it.
      PAXOS_VARIANT: ${PAXOS_VARIANT:-v1}
    entrypoint: ["sh", "-c", "sed -i \"s/^#\\?paxos_variant:.*/paxos_variant: $$PAXOS_VARIANT/\" /etc/cassandra/cassandra.yaml && exec docker-entrypoint.sh cassandra -f"]
    ports: ["127.0.0.1:9042:9042"]   # for the ScalarDB Core client on the host (loader, --fetcher core); the harness never connects here
    healthcheck: { test: ["CMD-SHELL", "cqlsh -e 'SELECT release_version FROM system.local' || exit 1"], interval: 10s, timeout: 10s, retries: 30 }

  schema-loader-cassandra:
    image: ghcr.io/scalar-labs/scalardb-schema-loader:3.19.1
    profiles: ["tools"]
    depends_on:
      backend-cassandra: { condition: service_healthy }
    volumes:
      - ./conf:/conf:ro
      - ./work:/work:ro
    command: ["--config", "/conf/scalardb-in-docker-cassandra.properties", "--schema-file", "/work/schema.json", "--coordinator", "--replication-factor", "1"]

  scalardb-cluster-cassandra:
    image: ghcr.io/scalar-labs/scalardb-cluster-node-byol-premium:3.19.1
    profiles: ["cassandra"]
    depends_on:
      backend-cassandra: { condition: service_healthy }
    ports: ["127.0.0.1:60054:60053"]
    volumes:
      - ./work/scalardb-cluster-node-cassandra.properties:/scalardb-cluster/node/scalardb-cluster-node.properties:ro

  schema-loader-oracle:
    image: ghcr.io/scalar-labs/scalardb-schema-loader:3.19.1
    profiles: ["tools"]
    depends_on:
      source-oracle: { condition: service_healthy }
    volumes:
      - ./conf:/conf:ro
      - ./work:/work:ro
    command: ["--config", "/conf/scalardb-in-docker-oracle.properties", "--schema-file", "/work/schema.json", "--coordinator"]

  scalardb-cluster-oracle:
    # Oracle Database as the ScalarDB backend (docs/oracle-backend-verification-plan.md): the same Oracle Free instance as
    # the migration source, but ScalarDB's own user (./oracle-backend-init.sh) and schemas. Host port 60055. Run one
    # cluster node at a time on an 8 GiB Docker VM.
    # Start with both profiles (it depends on source-oracle): docker compose --profile oracle --profile oracle-backend up -d
    image: ghcr.io/scalar-labs/scalardb-cluster-node-byol-premium:3.19.1
    profiles: ["oracle-backend"]
    depends_on:
      source-oracle: { condition: service_healthy }
    ports: ["127.0.0.1:60055:60053"]
    volumes:
      - ./work/scalardb-cluster-node-oracle.properties:/scalardb-cluster/node/scalardb-cluster-node.properties:ro

