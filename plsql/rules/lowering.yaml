# 変換基盤自身の限界（docs/design/plsql-kpi.md §2 の 12）
#
# 「まだ扱えない」は「変換できる」とは違う。黙って AUTO にしないために明示のルールにしてある。

rules:
  - id: LOWER-001
    match: {statementKind: Unsupported}
    decision: REVIEW
    severity: critical
    message: lowering がまだ模していない構文です。意味が保てる保証がありません
    requiredTests:
      - equivalent_result

  - id: LOWER-002
    match: {statementKind: Goto}
    decision: REDESIGN
    severity: critical
    message: GOTO に構造化された等価物はありません。制御フローを組み直す必要があります
    remediation:
      - CFG で region 解析を行い、構造化制御へ再構成する
    requiredTests:
      - control_flow_equivalence

  - id: CALL-002
    match: {statementKind: [SqlOperation, Expression], hasDiagnostic: OVERLOAD_UNRESOLVED}
    decision: REVIEW
    severity: critical
    message: オーバーロードされた routine を呼んでいますが、引数の数と名前からはどの版かを決められません。版ごとに判定が違いうるので、どれかの判定を借りることはしません
    remediation:
      - 名前付き引数（p_x => ...）で呼ぶか、版ごとに別の名前にする
      - 型だけが違うオーバーロードは、移行先では別名の method にする
    requiredTests:
      - equivalent_result

  # #104: OUT / IN OUT 引数のある関数は、式が必ず評価する位置にあるときだけ文に出す（plsql/hoist.py）。AND / OR の右辺や
  # CASE の分岐にあるものを出すと条件が偽でも呼んで引数を書き換えるので、出さずに残し、生成コードは断る
  - id: CALL-003
    match: {statementKind: Expression, hasDiagnostic: CALL_NOT_HOISTED}
    decision: REVIEW
    severity: critical
    message: OUT / IN OUT 引数のある関数を、評価されるかどうかが条件で決まる位置で呼んでいます。文に出すと条件が偽でも呼んでしまうので出していません。生成コードはこの呼び出しを断っています
    remediation:
      - 条件を if に分けて、関数を呼ぶ枝の中で文として呼ぶ
    requiredTests:
      - equivalent_result

  - id: CALL-001
    match: {unresolvedCallee: true}
    decision: REVIEW
    severity: critical
    message: 解析した範囲に無い routine を呼んでいます。呼び先が COMMIT するか、外へ何かを送るか、ロックを取るかは分かりません
    remediation:
      - 呼び先のソースを解析対象に加える
      - 加えられない（Oracle 提供のパッケージなど）なら、移行先での代替を決める
    requiredTests:
      - equivalent_result
