# Oracle 固有の意味（設計書 §6.4 / §6.5、実装計画 §10.2）
#
# ここは「変換できない」ではなく「変換候補は出せるが人の判断が要る」= REVIEW の領域である。
# どれも差分テストで落ちる典型で、Phase 3 の比較対象（§10.2）と 1 対 1 に対応させてある。
#
# アクセスパスに依存する判定（主キーでない列の SELECT INTO など）はここには無い。
# ScalarDB のスキーマを知る必要があり、P2-4 の担当になる。

rules:
  # 2026-09-20 の原則: REVIEW は「移行できるかが未解決」のときだけ。生成コードと実 DB の evidence で解決済みの問いは REVIEW に
  # 残さず、設計・運用への助言は判定を下げない注記（decision: AUTO）に分ける。性能と実行可否は、意味論のルールと混ぜない
  #
  # ROUND: PL/SQL の式と、生成器が SQL の外へ持ち上げた式は、互換ランタイム（Plsql.round = half-up）が計算し、Oracle の
  # 記録済みの答えと突き合わせてある。REVIEW にするのは、ROUND が**移行先 DB に評価される**文だけ（SEM-003 と同じ基準）
  - id: SEM-001
    match: {statementKind: SqlOperation, evaluatedByTarget: '\bROUND\s*\('}
    decision: REVIEW
    message: ROUND が Oracle 互換のランタイムを通らずに移行先 DB（ScalarDB SQL か実行計画の H2）で評価されます。Oracle の ROUND は half-up で、移行先の丸めが同じとは限りません
    requiredTests:
      - rounding_boundary

  # P4-3: SEM-002 はもともと TRUNC / SYSDATE / SYSTIMESTAMP を一括で REVIEW にしていた。
  # P3-3 が Oracle の日付演算を実機から 2015 件記録し（fixtures/plsql/semantics.json）、PlsqlPropertyTest が
  # Plsql の再現を検査するようになったので、**証拠が覆う範囲**は人手の確認を要求する理由が無くなった。
  # 覆うのは TRUNC・日付同士の減算・記録済みの TO_CHAR 書式で、覆わないのは下の 2 つである。
  # ルールが当たらない routine の判定は確信度に委ねられ、確信度は testEvidence を含む——つまり
  # 「比較して一致した routine だけが AUTO になる」。ルールを緩めたのではなく、証拠に置き換えた。
  - id: SEM-002
    match:
      statementKind: [SqlOperation, Expression]
      # **セッションの**タイムゾーンで値が変わる構文。CURRENT_* / LOCALTIMESTAMP / AT TIME ZONE は
      # SESSIONTIMEZONE に従うので、接続元によって別の値になる。実機で測った（semantics.json の clock 族):
      # DBTIMEZONE=+00:00 に対し SESSIONTIMEZONE=+09:00 で、CURRENT_TIMESTAMP は SYSTIMESTAMP と一致しない。
      #
      # SYSTIMESTAMP はここから外した（2026-09-17）。時刻を UTC に固定する決定（計画 §9）に加えて、
      # 次の連鎖が測定で閉じている: (1) Oracle 側で SYS_EXTRACT_UTC(SYSTIMESTAMP) = SYSDATE
      # （semantics.json、DBTIMEZONE が UTC のとき）、(2) Plsql.systimestamp() は sysdate() を UTC offset で
      # 返す（PlsqlTest）、(3) SYSDATE は scenario で固定して比較している。
      # **この連鎖は移行元 DB の DBTIMEZONE が UTC であることに依存する。** その前提が崩れていないことは
      # tests/test_plsql_property.py が semantics.json の記録に対して検査する。
      textMatches: '\bCURRENT_DATE\b|\bCURRENT_TIMESTAMP\b|\bLOCALTIMESTAMP\b|\bSESSIONTIMEZONE\b|\bDBTIMEZONE\b|AT\s+TIME\s+ZONE'
    decision: REVIEW
    message: セッションのタイムゾーンに依存します。CURRENT_* と AT TIME ZONE は接続元によって値が変わります
    remediation:
      - タイムゾーンを固定するか、UTC で保持して表示時に変換する
      - どのタイムゾーンで比較するのかを要件として決める
    requiredTests:
      - timezone

  # 2026-09-20: 「秒未満を捨ててよいかは業務の判断」と書いていたが、移行は Oracle の挙動を保つものである。Oracle は
  # 秒未満を**切り捨てる**（四捨五入しない。23:59:59.999999 は同じ日の 23:59:59。Oracle 23ai で SQL・PL/SQL とも実測）。
  # PL/SQL の式の CAST は互換ランタイム（Plsql.castDate）がそのとおりに計算し、実 DB の evidence もある
  # （shipment_days_in_transit_*）。REVIEW にするのは、CAST が**移行先 DB に評価される**文だけ（SEM-001 / 003 と同じ基準）
  - id: SEM-009
    match:
      statementKind: SqlOperation
      evaluatedByTarget: 'CAST\s*\([^)]*\bAS\s+DATE\b'
    decision: REVIEW
    message: TIMESTAMP から DATE への CAST が、Oracle 互換のランタイムを通らずに移行先 DB（ScalarDB SQL か実行計画の H2）で評価されます。Oracle は秒未満を切り捨てますが、移行先が同じとは限りません
    remediation:
      - CAST を SQL の外へ出し、値として bind する（ランタイムが Oracle と同じく秒未満を切り捨てる）
    requiredTests:
      - date_time_component

  - id: SEM-010
    match:
      statementKind: SqlOperation
      sqlKind: [INSERT, UPDATE, MERGE]
      # 列へ書かれる SYSTIMESTAMP。読んで判断に使うだけなら別だが、書かれた値は比較できない
      textMatches: '\bSYSTIMESTAMP\b'
    decision: REVIEW
    # 2026-09-20 / #8: 「時刻を呼び出し側から渡せば比較できる」は成り立たなかった。生成側は AuditContext で固定
    # できるが、Oracle 側の SYSTIMESTAMP は固定できず（FIXED_DATE は SYSDATE にしか効かない）、片側だけ固定しても
    # 比べる相手が無い。実 DB では、同じ行の時刻以外の列は一致している。REVIEW のまま残すと決めた: 残っている問いは
    # 「この時刻が業務上どこまで正確である必要があるか」で、人が決めることである
    message: SYSTIMESTAMP を列へ書いています。書かれた時刻の値は Oracle と突き合わせられません（移行元の時計を固定できないため。同じ行のほかの列は比較されます）
    remediation:
      - その列が業務上どこまで正確である必要があるか（精度、タイムゾーン、トランザクション内で同じ値か）を決める
      - 生成コードでは時刻は呼び出し側が渡す（AuditContext）。どの時計を渡すかは呼び出し側の設計になる
    requiredTests:
      - timezone

  - id: SEM-007
    match:
      clockReadsAtLeast: 2
    decision: REVIEW
    message: 1 つの routine が時計を 2 回以上読みます。2 回の読みは違う値を返しうるので、比較では区別できません
    remediation:
      - 冒頭で 1 度だけ読んで変数に入れ、その値を使い回す
      - 業務上、別々の時刻であるべきかを確認する
    requiredTests:
      - date_time_component

  - id: SEM-008
    match:
      statementKind: [SqlOperation, Expression]
      # NLS の言語設定で出力が変わる TO_CHAR 書式。Plsql.text は未対応の書式で例外を上げるが、
      # 実行時に落ちるより先に人が見るべきものである
      textMatches: "TO_CHAR\\s*\\([^)]*'[^']*(DAY|DY|MONTH|MON|AM|PM|RM)[^']*'"
    decision: REVIEW
    message: TO_CHAR の書式が NLS の言語設定に依存します。NLS_DATE_LANGUAGE で出力が変わります
    remediation:
      - 言語に依存しない書式（YYYY-MM-DD など）にするか、表示層で変換する
    requiredTests:
      - timezone

  # 2026-09-20 / #5: 空文字と NULL は、移行中は Oracle と同じく同一視する（決定）。その意味論を実装しているのは互換
  # ランタイム（Plsql.isNull / nvl / rtrim / eq ...）と、'' を NULL に正規化する書き込み境界（Plsql.bind）で、どちらも
  # 実 Oracle との比較で確かめてある。だから REVIEW にするのは、**それを通らずに移行先 DB が評価する**ときだけである:
  # ScalarDB へ送る SQL、または実行計画の残余 SQL に、空文字との比較・NVL・RTRIM が残っている文。PL/SQL の式と、
  # 生成器が SQL の外へ持ち上げた式（bind になる）は、ランタイムが計算するので対象にしない
  - id: SEM-003
    match: {statementKind: SqlOperation, evaluatedByTarget: "(=|<>|!=)\\s*''|\\bNVL\\s*\\(|\\bRTRIM\\s*\\("}
    decision: REVIEW
    message: 空文字・NULL・末尾空白に関わる式が、Oracle 互換のランタイムを通らずに移行先 DB（ScalarDB SQL か実行計画の H2）で評価されます。Oracle では空文字は NULL ですが、移行先ではそうではありません
    remediation:
      - 式を SQL の外へ出し、値として bind する（ランタイムが Oracle と同じ意味で計算し、'' は NULL として渡る）
      - 出せないなら、その列に空文字が入りえないこと（書き込み境界で NULL に正規化している）を前提に、結果が変わらないかを確かめる
    requiredTests:
      - null_and_empty_string

  # 集約の SELECT INTO: ScalarDB がそのまま実行する集約は、0 件でも 1 行（NULL / 0）を返すことを実 DB で確かめてある
  # （payment_paid_total_none、payment_last_paid_at_none、shipment_is_shippable_no_lines）。REVIEW にするのは、その文を
  # ScalarDB がそのまま実行しないとき（実行計画・拒否・ScalarDB のスキーマが無い）だけ
  - id: SEM-004
    match: {statementKind: SqlOperation, textMatches: '\b(SUM|COUNT|AVG|MIN|MAX)\s*\([^)]*\)[\s\S]{0,80}?\bINTO\b', targetStatusNot: [OK, WARN]}
    decision: REVIEW
    message: 集約の SELECT INTO で、ScalarDB がそのまま実行できる文ではありません。集約は 0 件でも 1 行返り、NO_DATA_FOUND にならず NULL になる、という差が保たれることを保証できません
    requiredTests:
      - aggregate_zero_rows

  # 2026-09-20 / #13: 「結合制約に当たるか、実行計画へ分解されるか」は、capability の層ができてからは変換器が
  # 答えている。そのまま実行できると判定された結合（targetStatus OK）には掛けない。実行計画になった結合は SQL-002、
  # 拒否された結合は SQL-001 が REVIEW にし、警告つき（WARN。暗黙の結合の書き換えなど）と、ScalarDB のスキーマが
  # 無くて誰も答えていない結合は、これまでどおりここで REVIEW になる。AUTO には実 DB の evidence が引き続き要る
  - id: SEM-005
    match: {statementKind: SqlOperation, textMatches: '\bJOIN\b|\bFROM\b[^)]*,', targetStatusNot: OK}
    decision: REVIEW
    message: 結合です。ScalarDB SQL の結合制約に当たるか、実行計画へ分解されるかを確認してください
    requiredTests:
      - equivalent_result

  - id: SEM-006
    match: {statementKind: SqlOperation, textMatches: '\bMERGE\b'}
    decision: REVIEW
    message: MERGE は upsert の原子性と競合条件を個別に確認する必要があります
    requiredTests:
      - concurrent_upsert

  # 2026-09-19: 記録された routine の MERGE は「読んでから UPDATE か INSERT を選ぶ」へ割る（#26 の
  # 続き）。**割ると MERGE という語が消え、SEM-006 が外れる**——だが競合の問いは消えていない。
  # 同時に「無い」と読んだ 2 つは commit で片方が弾かれ、再試行は呼び出し側の責務になる。
  # 書き換えで規則が黙って外れるのは、BULK-003 / CUR-001 と同じ形である
  # 2026-09-20: MERGE が割られるのは、その routine について「楽観制御にして、弾かれた要素を呼び出し側が再試行する」と
  # 決めて記録したとき（limits.yaml の rowLocks.optimistic）だけである。だから MERGE_SPLIT が付いている時点で、再試行の
  # 方針は決まっている。同時実行の挙動は実クラスタで確かめた（TransactionIT の
  # twoImportsOfTheSameNewCustomerDoNotBothInsertAndTheLoserRetriesAsAnUpdate: 同じ新規の顧客を同時に入れると片方が
  # commit で弾かれ、行は 1 つ、再試行は UPDATE の枝を通る）。移行の可否は開いていないので、判定を下げない注記にした。
  # 割られていない MERGE は SEM-006 が REVIEW にする
  - id: SEM-011
    match: {statementKind: SqlOperation, hasDiagnostic: MERGE_SPLIT}
    decision: AUTO          # 判定を下げない注記
    severity: info
    message: MERGE を読んでから UPDATE か INSERT を選ぶ形に割りました。同時に同じキーを書くと片方が commit で弾かれます。弾かれた要素だけを呼び出し側が再試行してください（その要素は冪等です。決定は limits.yaml の rowLocks.optimistic）
    requiredTests:
      - concurrent_upsert

  - id: CUR-001
    match: {statementKind: [OpenCursor, Fetch, CloseCursor]}
    decision: REVIEW
    message: 明示 cursor は寿命がトランザクション境界をまたぎます
    requiredTests:
      - cursor_lifetime

  # 2026-09-18: 明示 cursor の「読むだけのループ」を cursor FOR ループへ書き換えるようになった。
  # 書き換えたことは CUR_SCAN が言う。**書き換えで CUR-001 が外れても、cursor の寿命の問いは
  # 消えていない**——ループの中で COMMIT していたなら、Oracle の cursor はそれをまたいで読み続けて
  # いたが、移行先は先に全部読む。読む時点が変わることを、ここで人に渡す
  - id: CUR-003
    match: {statementKind: Loop, hasDiagnostic: CUR_SCAN}
    decision: REVIEW
    message: 明示 cursor を先読みの走査に置き換えました。cursor が COMMIT をまたいでいたなら、読む時点が変わります
    requiredTests:
      - cursor_lifetime
      - row_limit

  # 行数とメモリは性能の問いで、答える場所は limits.yaml である（値を書くか、上限では守らない理由を書く）。決めてあれば
  # 生成コードがその上限を守る（超えたら RowLimitExceededException）ので、問いは開いていない。既定値に落ちた routine は
  # 誰も決めていないので REVIEW のまま
  - id: CUR-002
    match: {statementKind: Loop, loopKind: cursor-for, lacksDiagnostic: ROW_LIMIT_DECIDED}
    decision: REVIEW
    message: Cursor FOR LOOP です。走査する行数の上限が決まっていません（limits.yaml）。N+1 とメモリ、fetch size を確認する必要があります
    requiredTests:
      - row_limit
      - performance

  - id: CUR-OPT-002
    match: {statementKind: Loop, loopKind: cursor-for, hasDiagnostic: ROW_LIMIT_DECIDED}
    decision: AUTO          # 判定を下げない注記
    severity: info
    message: Cursor FOR LOOP です。走査する行数の上限は limits.yaml で決めてあり、生成コードがそれを守ります。N+1 の往復と fetch size は、性能試験で確かめることを推奨します

  # 書き換えたあとの形に合わせてある（#14 / 2026-09-18）。`FETCH ... BULK COLLECT INTO v LIMIT n`
  # は「n 件ずつ**配る**ループ」になり、行は先にまとめて読む。**LIMIT はもうメモリを守っていない**
  # ——守るのは走査行数の上限なので、この規則が要求するのは今も row_limit である
  - id: BULK-003
    match: {statementKind: Loop, hasDiagnostic: BULK_CHUNKED, lacksDiagnostic: ROW_LIMIT_DECIDED}
    decision: REVIEW
    message: 分割読みは行をまとめて読む形になりました。メモリを守るのは LIMIT ではなく走査行数の上限です
    requiredTests:
      - row_limit

  - id: BULK-OPT-003
    match: {statementKind: Loop, hasAllDiagnostics: [BULK_CHUNKED, ROW_LIMIT_DECIDED]}
    decision: AUTO          # 判定を下げない注記
    severity: info
    message: 分割読みは行をまとめて読む形になりました。走査する行数の上限は limits.yaml で決めてあり、生成コードがそれを守ります


  # レビュー #27 の 26d。`WHEN OTHERS THEN NULL` は Oracle でも悪い書き方だが、移行先ではさらに意味が変わる:
  # ScalarDB の競合（CrudConflictException など）まで握りつぶすと、使えなくなったトランザクションで先へ進む
  - id: EXC-002
    match: {swallowsOthers: true}
    decision: REVIEW
    severity: critical
    message: WHEN OTHERS THEN NULL があります。移行先ではトランザクションの競合や接続の失敗まで握りつぶします
    remediation:
      - 無視してよい例外を名前で書き、それ以外は呼び出し側へ返す
    requiredTests:
      - exception_path

  - id: SQL-003
    match: {statementKind: SqlOperation, hasDiagnostic: BIND_SHADOWED}
    decision: REVIEW
    message: SQL の中の名前が、PL/SQL 変数でもあり表の列でもあります。Oracle は列として読むので、変数との比較のつもりなら結果が違います
    remediation:
      - 変数の名前を変える（p_ / v_ を付ける）か、列を表名で修飾する

  - id: SQL-004
    match: {rowCountUntracked: true}
    decision: REVIEW
    message: SQL%ROWCOUNT を読んでいますが、静的な DML 以外（FORALL・動的 SQL・MERGE・呼び出し先の SQL）が件数を決めうる routine です
    remediation:
      - 件数を返す形に呼び出し先を直すか、件数を読む位置を静的な DML の直後に寄せる
    requiredTests:
      - row_count

  - id: EXC-001
    match: {handlesException: [DUP_VAL_ON_INDEX, INVALID_NUMBER, VALUE_ERROR]}
    decision: REVIEW
    severity: critical
    message: 移行先では自然には起こらない例外の handler があります。Oracle では DB 自身の誤りでも走っていた処理が、移行先では走りません
    remediation:
      - DUP_VAL_ON_INDEX は「読んで、無ければ INSERT、あれば UPDATE」か UPSERT に書き直す（ScalarDB は重複 INSERT のあとトランザクションを続けられない）
      - INVALID_NUMBER / VALUE_ERROR は、変換の前に値を検査する形に書き直す
    requiredTests:
      - exception_path

