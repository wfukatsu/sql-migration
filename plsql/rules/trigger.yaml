# Trigger と DB Link（設計書 §6.9 / §6.7、docs/plsql-kpi.md §2 の 5・7）

rules:
  - id: TRG-001
    match: {moduleKind: trigger}
    decision: REDESIGN
    severity: critical
    message: Trigger は隠れた副作用です。全書込経路を Service 側で統制する必要があります
    remediation:
      - validation は Service の検証と DB 制約へ
      - audit は interceptor / outbox へ
      - before/after 値と失敗時の挙動を保つ
    requiredTests:
      - all_write_paths_covered

  - id: TRG-002
    match: {statementKind: SqlOperation, hasDiagnostic: [TRIGGER_NOT_APPLIED, TRIGGER_REDESIGN]}
    decision: REDESIGN
    severity: critical
    message: trigger の掛かる表へ書き込んでいますが、その trigger を呼び出しに置き換えられていません。移行先ではこの書き込みで trigger の処理が走りません
    remediation:
      - trigger の処理を、この書き込みをする Service に持たせる（値を書き換える trigger は採番 Service へ）
      - 複数行の更新・DELETE・MERGE・複数イベントの trigger は、行ごとに何を渡すかを設計する
    requiredTests:
      - all_write_paths_covered

  - id: LINK-001
    match: {dbLink: true}
    decision: REDESIGN
    severity: critical
    message: DB Link 越しの操作は分散トランザクションです
    remediation:
      - 参加 DB・timeout・再試行を設計する
      - ScalarDB の分散トランザクションか API 連携へ
    requiredTests:
      - distributed_failure

  - id: EXT-001
    match: {externalPackage: true}
    decision: REDESIGN
    severity: critical
    message: UTL_* / DBMS_SCHEDULER / AQ などの外部副作用があります
    remediation:
      - adapter 経由の外部 Service にする
      - timeout・再試行・冪等性を決める
    requiredTests:
      - external_failure
