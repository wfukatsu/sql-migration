# 動的 SQL（設計書 §6.8、docs/design/plsql-kpi.md §2 の 4）
#
# 定数に畳み込めるものと、実行時に組み立てられるものを分ける。前者は解析できるので REVIEW、
# 後者は allowlist か専用 Repository への再設計になる。

rules:
  # #157（2026-09-30）: 設計書 §6.8 の「動的 table / column」「動的 where / order」にそろえた。連結の穴（literal でない項）
  # ごとに、組み上がる文の中の位置を plsql/dynamic.py の holes が判定する。表・列・ORDER BY の式と方向・WHERE の断片・
  # PL/SQL ブロックの routine 名に穴があれば当たる。値の位置（引用符の中、比較の右辺、IN の並び、VALUES など）だけなら
  # 当たらず、DYN-002 のまま。以前は表の位置（FROM / INTO / TABLE / JOIN / UPDATE の直後）だけを見ていた。
  # limits.yaml の dynamicTables（穴が 1 つの文の、受け付ける名前の一覧）か dynamicSql（穴ごとの一覧。#165）で、routine の
  # DYN-001 の文がすべて展開できれば、REDESIGN のまま「決定済み」になる。展開できない文があれば未決定のまま
  - id: DYN-001
    match: {statementKind: DynamicSql, constantSql: false, identifierInterpolation: true}
    decision: REDESIGN
    severity: critical
    message: 表名・列名・ORDER BY・WHERE の断片など、識別子や SQL の構文が実行時に決まる SQL です。allowlist か専用 Repository への再設計が要ります
    remediation:
      - allowlist 型の query builder にする（受け付ける表名・列名・並べ替えを列挙し、それ以外は拒否する）
      - 有限 variant なら variant ごとに静的な query にする
      - 穴が 1 つなら、受け付ける名前を limits.yaml の dynamicTables に書くと、名前ごとの静的な文を生成する
      - 穴が 2 つ以上（ORDER BY の列と方向など）なら、limits.yaml の dynamicSql に穴ごとの一覧を書くと、組み合わせごとの静的な文を生成する（1 文 64 通りまで）
    requiredTests:
      - dynamic_sql_variants

  # 2026-09-20: 動的 SQL のとりうる文をすべて静的な文に展開でき、その全部を ScalarDB がそのまま実行できるなら、bind の
  # 復元は展開の時点で済んでいて、結果は実 DB の evidence で確かめられる。残る権限の確認は運用への助言で、移行の可否
  # ではない（DYN-OPT-002）。展開できない・一部が実行計画や拒否になる・ScalarDB のスキーマが無いときは REVIEW のまま
  - id: DYN-002
    match: {statementKind: DynamicSql, dynamicResolved: false}
    decision: REVIEW
    message: 動的 SQL です。とりうる文をすべて展開して ScalarDB がそのまま実行できる、とは確かめられていません。bind の復元と権限の確認が要ります
    requiredTests:
      - bind_restoration

  - id: DYN-OPT-002
    match: {statementKind: DynamicSql, dynamicResolved: true}
    decision: AUTO          # 判定を下げない注記
    severity: info
    message: 動的 SQL は、とりうる文をすべて静的な文に展開して生成しました（どれも ScalarDB がそのまま実行できます）。Oracle で EXECUTE IMMEDIATE に与えていた権限に相当するものが移行先に要るかは、運用で確認することを推奨します

  # #148 H1: 畳んだ文が DDL。表だけの TRUNCATE TABLE は全行の DELETE にするので当たらない（#154）。Oracle の DDL は前後で COMMIT する（AUTO 禁止条件 1 と同じ性質）。
  # 移行先ではスキーマを Schema Loader が持ち、routine からは流さない（#52）。limits.yaml の ddl.omit で省くと決めた
  # routine の DDL は DYNAMIC_DDL_OMITTED になり、この規則には当たらない
  - id: DYN-004
    match: {statementKind: SqlOperation, hasDiagnostic: DYNAMIC_DDL}
    decision: REDESIGN
    severity: critical
    message: 動的 SQL の中に DDL（CREATE / DROP / ALTER / TRUNCATE など）があります。Oracle では暗黙に COMMIT し、移行先では routine から DDL を流しません
    remediation:
      - CASCADE などの付いた TRUNCATE は、トランザクションの外で行う運用の処理（バッチの前処理など）に移すか、DELETE する形にする
      - 作ってすぐ消す一時表なら、用途を再設計するか、省くと決めて limits.yaml の ddl.omit に理由を書く
    requiredTests:
      - transaction_boundary

  - id: DYN-003
    match: {statementKind: [SqlOperation, Expression], textMatches: '\bDBMS_SQL\b'}
    decision: REDESIGN
    severity: critical
    message: DBMS_SQL は静的解析だけでは追えません。実行ログも使って query family を洗い出す必要があります
    remediation:
      - 実行ログから実際に流れた SQL を集める
      - allowlist 型の専用 Repository にする
    requiredTests:
      - dynamic_sql_variants
