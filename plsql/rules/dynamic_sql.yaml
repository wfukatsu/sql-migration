# 動的 SQL（設計書 §6.8、docs/plsql-kpi.md §2 の 4）
#
# 定数に畳み込めるものと、実行時に組み立てられるものを分ける。前者は解析できるので REVIEW、
# 後者は allowlist か専用 Repository への再設計になる。

rules:
  - id: DYN-001
    match: {statementKind: DynamicSql, constantSql: false, identifierInterpolation: true}
    decision: REDESIGN
    severity: critical
    message: 表名など識別子が実行時に決まる SQL です。allowlist か専用 Repository への再設計が要ります
    remediation:
      - allowlist 型の query builder にする
      - 有限 variant なら variant ごとに静的な query にする
    requiredTests:
      - dynamic_sql_variants

  # 2026-09-20: 動的 SQL のとりうる文をすべて静的な文に展開でき、その全部を ScalarDB がそのまま実行できるなら、bind の
  # 復元は展開の時点で済んでいて、結果は実 DB の evidence で確かめられる。残る権限の確認は運用への助言で、移行の可否
  # ではない（DYN-OPT-002）。展開できない・一部が実行計画や拒否になる・ScalarDB のスキーマが無いときは REVIEW のまま
  - id: DYN-002
    match: {statementKind: DynamicSql, dynamicResolved: false}
    decision: REVIEW
    message: 動的 SQL です。とりうる文をすべて展開して ScalarDB がそのまま実行できる、とは確かめられていません。bind の復元と権限の確認が要ります
    requiredTests:
      - bind_restoration

  - id: DYN-OPT-002
    match: {statementKind: DynamicSql, dynamicResolved: true}
    decision: AUTO          # 判定を下げない注記
    severity: info
    message: 動的 SQL は、とりうる文をすべて静的な文に展開して生成しました（どれも ScalarDB がそのまま実行できます）。Oracle で EXECUTE IMMEDIATE に与えていた権限に相当するものが移行先に要るかは、運用で確認することを推奨します

  - id: DYN-003
    match: {statementKind: [SqlOperation, Expression], textMatches: '\bDBMS_SQL\b'}
    decision: REDESIGN
    severity: critical
    message: DBMS_SQL は静的解析だけでは追えません。実行ログも使って query family を洗い出す必要があります
    remediation:
      - 実行ログから実際に流れた SQL を集める
      - allowlist 型の専用 Repository にする
    requiredTests:
      - dynamic_sql_variants
