# 動的 SQL（設計書 §6.8、docs/plsql-kpi.md §2 の 4）
#
# 定数に畳み込めるものと、実行時に組み立てられるものを分ける。前者は解析できるので REVIEW、
# 後者は allowlist か専用 Repository への再設計になる。

rules:
  - id: DYN-001
    match: {statementKind: DynamicSql, constantSql: false, identifierInterpolation: true}
    decision: REDESIGN
    severity: critical
    message: 表名など識別子が実行時に決まる SQL です。allowlist か専用 Repository への再設計が要ります
    remediation:
      - allowlist 型の query builder にする
      - 有限 variant なら variant ごとに静的な query にする
    requiredTests:
      - dynamic_sql_variants

  - id: DYN-002
    match: {statementKind: DynamicSql}
    decision: REVIEW
    message: 動的 SQL は定数に畳み込めても bind の復元と権限の確認が要ります
    requiredTests:
      - bind_restoration
