# ScalarDB の能力（設計書 §7.3、docs/design/plsql-kpi.md §2 の 9・10・11）
#
# ここは「ターゲットが何を実行できるか」だけを見る。判定の材料は P2-4 が IR に書き込んだ
# target_status と診断であり、このファイルはその意味を決める。
#
# 完全な dialect 実装を先に書かないのは設計書 §7.3 の判断による。近似して黙って出す方が、
# 断るより悪い。converter は未対応構文を ERROR にするので、ここはその答えを運ぶだけでよい。

rules:
  - id: SCAN-001
    # Expression: 呼び出し先が、この routine の書いた表を走査する（同じトランザクションの中で走る）。呼び出しは
    # Call 文とは限らない。関数は代入や条件の式の中から呼ばれる（`v_n := pkg.open_count;`）
    match: {statementKind: [SqlOperation, Expression], hasDiagnostic: SCAN_AFTER_WRITE}
    decision: REDESIGN
    severity: critical
    message: 同一トランザクションで書いた表を走査しています。ScalarDB はこれを拒否します
    remediation:
      - 耐久境界で routine を分割する
      - 読み取りを主キーまたはパーティションキーのアクセスに変える
    requiredTests:
      - scan_after_write

  # 2026-09-20: PL/SQL の移行先は JDBC バックエンドに限定すると決めてある（#20）。そこではこの走査は実行でき、結果は
  # 実 DB の evidence で確かめられるので、移行の可否は開いていない: 判定を下げない注記にした。JDBC 以外を対象に変換
  # すると変換器がこの文を拒否し、SQL-001 が REVIEW にする。走査する行数は行数上限のルール（CUR-002 など）が見る
  - id: SCAN-002
    match: {statementKind: SqlOperation, hasDiagnostic: CROSS_PARTITION}
    decision: AUTO          # 判定を下げない注記
    severity: info
    message: パーティションキーで絞れない走査です。JDBC バックエンドでは実行できますが、フィルタも順序もパーティションをまたぐため、JDBC 以外（Cassandra など）では同じ問い合わせが通りません。そこへ移すときは、キーで届く読み取りに直す必要があります
    remediation:
      - キーで届く読み取りに変える
      - 全行を取得してアプリ側で絞る・並べる（docs/design/app-side-processing-plan.md）
    requiredTests:
      - cross_partition_scan

  # 2026-09-20 / #4: このルールは 2 つの問いを混ぜていた。「移行後も Oracle の意味論を再現できるか」と「データモデルに
  # 一意性を明示すべきか」である。前者は生成コードが答える: そのまま実行できる文は最大 2 件だけ読み（LIMIT 2）、0 件は
  # NO_DATA_FOUND、2 件目があれば TOO_MANY_ROWS にする。後者は設計の改善で、移行の可否ではない（SELECT-OPT-001）。
  #
  # REVIEW に残すのは、その意味論の保存を**保証できない**ときだけである: ScalarDB がそのまま実行できる文ではない
  # （実行計画になった・拒否された・ScalarDB のスキーマが無く誰も確かめていない）。走査の可否と性能は別のルールが見る
  # （SCAN-002、SQL-001 / 002、動的 SQL は DYN-*）。Oracle との一致を示す evidence が無ければ、確信度が AUTO にしない。
  - id: SELECT-001
    match: {statementKind: SqlOperation, hasDiagnostic: MULTI_ROW_INTO, targetStatusNot: [OK, WARN]}
    decision: REVIEW
    message: キーで届かない SELECT INTO で、ScalarDB がそのまま実行できる文ではありません。0 件と複数件の意味（NO_DATA_FOUND / TOO_MANY_ROWS）が生成コードで保たれることを保証できません
    requiredTests:
      - no_data_found
      - too_many_rows

  - id: SELECT-OPT-001
    match: {statementKind: SqlOperation, hasDiagnostic: MULTI_ROW_INTO, targetStatus: [OK, WARN]}
    decision: AUTO          # 判定を下げない注記。移行の可否ではなく、データモデルへの推奨である
    severity: info
    message: この SELECT INTO はキーまたは一意制約による直接取得ではありません。意味論は生成コードによって維持されます（最大 2 件を読み、0 件は NO_DATA_FOUND、2 件以上は TOO_MANY_ROWS）。業務上一意である場合は、キーまたは一意制約としてデータモデルに明示することを推奨します
    remediation:
      - 業務上一意なら、その列をキーまたは一意制約としてデータモデルに明示する
      - 複数件から特定の 1 件を選ぶ形に変えるのは、別の仕様変更として扱う（LIMIT 1 や ORDER BY を足して済ませない）
