# SQL とデータアクセス（設計書 §6.4 / §6.5、docs/design/plsql-kpi.md §2 の 8・9・10）

rules:
  - id: LOCK-001
    match: {statementKind: SqlOperation, lockingMode: any}
    decision: REDESIGN
    severity: critical
    message: 行ロックです。ターゲットで同じ保証を別の方法で与える設計が要ります
    remediation:
      - 楽観制御と再試行にする
      - NOWAIT / SKIP LOCKED は待たない意味を個別に設計する
    requiredTests:
      - concurrent_update

  - id: LOCK-002
    match: {cursorLocking: true}
    decision: REDESIGN
    severity: critical
    message: cursor の宣言で行ロックしています。文だけを見ると見えない形です
    remediation:
      - 楽観制御と再試行にする
      - SKIP LOCKED の「取り合い」の意味を業務要件として決める
    requiredTests:
      - concurrent_claim

  - id: BULK-002
    match: {saveExceptions: true}
    decision: REDESIGN
    severity: critical
    message: FORALL SAVE EXCEPTIONS は一部を失敗させたまま残りを確定させます。原子性は業務要件です
    remediation:
      - item 別の結果と再試行にする
      - どこまで確定してよいかを要件として決める
    requiredTests:
      - partial_failure

  - id: SQL-001
    match: {statementKind: SqlOperation, targetStatus: ERROR}
    decision: REVIEW
    severity: critical
    message: ScalarDB SQL で実行できない文があります
    requiredTests:
      - equivalent_result

  - id: SQL-002
    match: {statementKind: SqlOperation, targetStatus: PLANNED}
    decision: REVIEW
    message: 実行計画（取得 + H2）に分解される文です。行数上限と性能を確認してください
    requiredTests:
      - row_limit
      - performance

  - id: BULK-001
    match: {statementKind: SqlOperation, textMatches: '\bBULK\s+COLLECT\b'}
    decision: REVIEW
    message: BULK COLLECT は行数上限とメモリ上限が要ります
    requiredTests:
      - row_limit

  - id: RECUR-001
    match: {recursive: true}
    decision: REVIEW
    message: 再帰です。スタックと DB ラウンドトリップの深さを確認してください
    requiredTests:
      - recursion_depth

  - id: DICT-001
    match: {statementKind: SqlOperation, textMatches: '(?i)\b(?:USER|ALL|DBA|CDB)_(?:OBJECTS|TABLES|TAB_COLUMNS|TAB_COLS|SOURCE|ERRORS|CONSTRAINTS|CONS_COLUMNS|INDEXES|IND_COLUMNS|SEQUENCES|TRIGGERS|PROCEDURES|ARGUMENTS|VIEWS|SYNONYMS|DEPENDENCIES|TYPES|PLSQL_OBJECT_SETTINGS|IDENTIFIERS|USERS|TAB_PRIVS|ROLE_PRIVS|SYS_PRIVS|SCHEDULER_JOBS|JOBS|LOBS|SEGMENTS|TAB_PARTITIONS|PART_TABLES)\b|\bG?V\$\w+'}
    decision: REDESIGN
    severity: critical
    message: Oracle のデータ辞書（USER_* / ALL_* / DBA_* / V$*）を読んでいます。移行先にはありません
    remediation:
      - 何を知るための問合せかを決め、移行先のメタデータ（ScalarDB の Admin API など）か設定値に置き換える
    requiredTests:
      - equivalent_result


  # #148 M1: 移行先に CHECK / FOREIGN KEY / UNIQUE は無い。書く側で守るか（limits.yaml constraints.enforce）は決定で、
  # 決めると生成コードが変わる（guard が入る）。決めていない表へ書く routine は AUTO にしない
  - id: CONS-001
    match: {statementKind: SqlOperation, hasDiagnostic: CONSTRAINT_UNDECIDED}
    decision: REVIEW
    severity: warning
    message: 移行先に無い制約（CHECK / FOREIGN KEY / UNIQUE、子のある親の DELETE）のある表へ書いています。Oracle が断った書き込みが移行先では通ります。書く側で守るかを決めてください
    remediation:
      - 守るなら表を limits.yaml の constraints.enforce に理由つきで書く（CHECK・外部キー・NOT NULL は書く前に検査し、Oracle と同じ番号で投げる）
      - 守らないなら、その理由（呼び出し側が検査している、など）を記録する
    requiredTests:
      - constraint_violation

  # #148 M1: 守ると決めた表でも、書く前に検査できない制約がある（UNIQUE、子のある親の DELETE、書く値を表から読む式、
  # INSERT … SELECT、動的 SQL の文）。その書き込みは Oracle と違う結果になりうる
  - id: CONS-002
    match: {statementKind: SqlOperation, hasDiagnostic: CONSTRAINT_NOT_GUARDED}
    decision: REVIEW
    severity: warning
    message: 守ると決めた表の制約のうち、この書き込みでは検査していないものがあります（UNIQUE、子のある親の DELETE、書く値が文から読めない、など）。Oracle が断る書き込みが移行先では通ります
    remediation:
      - UNIQUE は、同じ値の行を先に読む（索引か、キーを変える設計）か、重複しないことを呼び出し側で保証する
      - 子のある親の DELETE は、先に子の表を読んで断るか、子を消す順序を設計する
    requiredTests:
      - constraint_violation
