# Package 状態と権限（設計書 §6.1 / §6.2、docs/design/plsql-kpi.md §2 の 3・6）

rules:
  - id: STATE-001
    match: {packageState: true}
    decision: REDESIGN
    severity: critical
    message: Package 変数はセッションに紐づく状態です。Singleton bean の field へ置くと意味が変わります
    remediation:
      - 引数で渡す
      - 明示的な SessionContext か永続化に移す
    requiredTests:
      - state_isolation_between_calls

  # #108: パッケージ本体の初期化部（BEGIN … END pkg;）は、セッションで最初にパッケージを参照したときに 1 回だけ走る。
  # 移行先に相当するものは無く、黙って落としていた。状態と同じく、どこで何をするかは人が決める
  - id: STATE-002
    match: {packageInitialisation: true}
    decision: REDESIGN
    severity: critical
    message: パッケージ本体に初期化部（BEGIN … END）があります。Oracle ではセッションで最初にこのパッケージを参照したときに、呼んだ routine より先に 1 回だけ走ります（そこで起きた例外は呼び出し元に届きます）。生成コードには入っていません
    remediation:
      - 初期化部がすることを、アプリの起動時の処理か、各 routine の前に呼ぶ明示的な初期化に移す
      - package 変数を設定しているなら、STATE-001 の決定（引数で渡す / SessionContext / 永続化）と合わせて決める
    requiredTests:
      - package_initialisation_runs_once

  - id: AUTHID-001
    match: {authId: CURRENT_USER}
    decision: REDESIGN
    severity: critical
    message: AUTHID CURRENT_USER は呼出者権限で動きます。認証・認可モデルを別に設計する必要があります
    remediation:
      - Service の identity と認可を設計する
    requiredTests:
      - caller_context_authorization
